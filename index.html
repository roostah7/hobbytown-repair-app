function renderDashboard() {
  const db = loadDB();
  // Search across phone (digits), customer name, ticket #, AND item description / issue description
  const rawQuery = (view.search || '').trim();
  const lowerQuery = rawQuery.toLowerCase();
  const digits = rawQuery.replace(/\D/g, '');
  let repairs = db.repairs.slice();
  if (rawQuery) {
    const matchedCustomerIds = new Set(
      db.customers.filter(c =>
        (digits && c.phone.includes(digits)) ||
        (lowerQuery && c.name && c.name.toLowerCase().includes(lowerQuery))
      ).map(c => c.id)
    );
    repairs = repairs.filter(r =>
      matchedCustomerIds.has(r.customer_id) ||
      String(r.ticket).includes(digits || rawQuery.replace('#','')) ||
      (r.item_description && r.item_description.toLowerCase().includes(lowerQuery)) ||
      (r.issue_description && r.issue_description.toLowerCase().includes(lowerQuery))
    );
  }
  // Build the "deleted" bucket separately — these are soft-deleted, hidden everywhere except the dedicated view
  const deletedAll = db.repairs.filter(isDeleted)
    .sort((a,b) => (b.deleted_at || '').localeCompare(a.deleted_at || ''));

  // Categorize. "Needs Attention" is a CALLOUT/CLASSIFICATION across the other sections,
  // not a separate bucket — the same repair appears in BOTH Needs Attention AND its real status section.
  const inDeleted = view.name === 'deleted';
  const inArchive = view.name === 'archive';
  const needsAttention = [];
  const inShop = [];
  const ready = [];
  const closed = [];   // recently closed (≤ 7 days)
  const archived = []; // closed > 7 days ago — hidden from main dashboard
  for (const r of repairs) {
    if (isDeleted(r)) continue;
    if (isArchived(r)) {
      archived.push(r);
      // When a search is active OR we're viewing the archive, allow archived items into Closed
      if (!inArchive && !view.search) continue;
    }
    const ps = db.parts.filter(p => p.repair_id === r.id);
    const alerts = repairAlerts(r, ps);
    if (alerts.length) needsAttention.push({ r, alerts });
    if (r.status === 'ready' && !r.picked_up_date) ready.push(r);
    else if (['picked','aband'].includes(r.status)) closed.push(r);
    else inShop.push(r);
  }
  // Sort In the Shop by drop-off date ASCENDING — longest-waiting repair at the top so techs work it first
  inShop.sort((a,b) => a.dropoff_date.localeCompare(b.dropoff_date));
  // Ready for Pickup: oldest notification first (those have been waiting longest)
  ready.sort((a,b) => (a.ready_notified_date||'').localeCompare(b.ready_notified_date||''));
  // Closed (recent): newest first (most recent activity at top)
  closed.sort((a,b) => (b.picked_up_date || b.abandoned_date || '').localeCompare(a.picked_up_date || a.abandoned_date || ''));
  // Archived: newest closure first
  archived.sort((a,b) => (repairClosureDate(b) || '').localeCompare(repairClosureDate(a) || ''));
  // IDs of repairs that are also in Needs Attention — used by repairRow to draw a ⚠ chip
  const flaggedIds = new Set(needsAttention.map(x => x.r.id));

  $root.innerHTML = `
    <div class="app">
      <div class="search-row">
        <input id="search" placeholder="Search by phone, name, or ticket # (e.g. 0142 or Mike)" value="${escapeHtml(view.search || '')}" />
        <button class="btn" id="newbtn">+ New repair</button>
      </div>
      <div class="tip-strip">
        <strong>Tip:</strong> when a customer calls, type the last 4 digits of their phone above.
      </div>
      ${inDeleted ? `
        <div style="margin-bottom:14px"><a href="#" id="backToDash" style="font-size:14px">&larr; Back to dashboard</a></div>
        <div class="tip-strip callout-warn">
          <strong>Deleted repairs.</strong> ${deletedAll.length} total. Click a repair to view it; from there you can ${currentUser().role === 'owner' ? '<strong>undelete</strong> it' : 'ask Bryce to undelete it'}.
        </div>
        ${section('Deleted', '', deletedAll.map(r => repairRow(db, r, new Set())))}
      ` : inArchive ? `
        <div style="margin-bottom:14px"><a href="#" id="backToDash" style="font-size:14px">&larr; Back to dashboard</a></div>
        <div class="tip-strip callout-info">
          <strong>Archive view.</strong> Closed repairs over ${ARCHIVE_AFTER_DAYS} days old. ${archived.length} total. Search bar still works.
        </div>
        ${section('Archived repairs', '', archived.map(r => repairRow(db, r, flaggedIds)))}
      ` : `
        ${needsAttention.length ? `
          ${section('Needs Attention', 'alert', needsAttention.map(x => attentionRow(db, x)), 'Flagged from the queue below — overdue parts, ready-for-pickup, or near-abandonment')}
          <div class="section-divider"></div>
        ` : ''}
        ${section('In the Shop',     '',      inShop.map(r => repairRow(db, r, flaggedIds)), 'Sorted oldest first — work the top of the list to keep customers from waiting')}
        ${section('Ready for Pickup','',      ready.map(r => repairRow(db, r, flaggedIds)), 'Oldest notification first — chase pickups before storage fees pile up')}
        ${section('Recently Closed', '', closed.map(r => repairRow(db, r, flaggedIds)), 'Picked up or abandoned in the last ' + ARCHIVE_AFTER_DAYS + ' days')}
        ${archived.length ? `
          <div style="text-align:center; margin-top:8px;">
            <a href="#" id="viewArchive" style="font-size:13px; color:var(--muted);">📦 View ${archived.length} archived repair${archived.length===1?'':'s'} (older than ${ARCHIVE_AFTER_DAYS} days)</a>
          </div>
        ` : ''}
        ${deletedAll.length ? `
          <div style="text-align:center; margin-top:4px;">
            <a href="#" id="viewDeleted" style="font-size:13px; color:var(--muted);">🗑 View ${deletedAll.length} deleted repair${deletedAll.length===1?'':'s'}</a>
          </div>
        ` : ''}
      `}
    </div>
  `;
  document.getElementById('newbtn').onclick = () => go({ name: 'new' });
  const $s = document.getElementById('search');
  $s.oninput = (e) => { view.search = e.target.value; renderDashboard(); $s.focus(); };
  const delLink = document.getElementById('viewDeleted');
  if (delLink) delLink.onclick = (e) => { e.preventDefault(); go({ name: 'deleted' }); };
  const archLink = document.getElementById('viewArchive');
  if (archLink) archLink.onclick = (e) => { e.preventDefault(); go({ name: 'archive' }); };
  const backLink = document.getElementById('backToDash');
  if (backLink) backLink.onclick = (e) => { e.preventDefault(); go({ name: 'dashboard' }); };
  document.querySelectorAll('[data-rid]').forEach(el => {
    el.onclick = () => go({ name: 'detail', id: el.dataset.rid });
  });
}

function section(title, klass, rowsHtml, subtext) {
  return `
    <div class="section ${klass}">
      <h2>${title} <span class="count">${rowsHtml.length}</span></h2>
      ${subtext ? `<div class="section-sub">${escapeHtml(subtext)}</div>` : ''}
      ${rowsHtml.length ? rowsHtml.join('') : '<div class="empty">Nothing here.</div>'}
    </div>
  `;
}
// Color-coded chip showing how many days a repair has been in the shop.
// Green ≤3, yellow ≤7, orange ≤14, red 15+
function daysInShopChip(r) {
  if (!r.dropoff_date) return '';
  const days = diffDays(r.dropoff_date);
  if (days < 0) return '';
  let cls = 'days-fresh';
  if (days >= 15) cls = 'days-very-old';
  else if (days >= 8) cls = 'days-old';
  else if (days >= 4) cls = 'days-aging';
  const label = days === 0 ? 'today' : days === 1 ? '1 day' : days + ' days';
  return `<span class="days-chip ${cls}" title="${days} day${days===1?'':'s'} since drop-off">${label} in shop</span>`;
}

function repairRow(db, r, flaggedIds) {
  const c = db.customers.find(x => x.id === r.customer_id) || {};
  const timer = activeTimerForRepair(db, r.id);
  const timerBadge = timer ? `<span class="badge timer" title="${escapeHtml(timer.tech_name)} is working on this">🔧 ${escapeHtml(timer.tech_name)}</span>` : '';
  const flagBadge = (flaggedIds && flaggedIds.has(r.id)) ? `<span class="badge alert" title="Also flagged in Needs Attention above">⚠ flagged</span>` : '';
  const displayName = c.name || '(no name)';
  const displayItem = r.item_description || '(no item description)';
  const displayPhone = c.phone ? formatPhone(c.phone) : '—';
  return `
    <div class="row" data-rid="${r.id}">
      <div class="ticket">#${r.ticket}</div>
      <div class="who">
        ${escapeHtml(displayName)}
        <small>${escapeHtml(displayItem)}</small>
      </div>
      <div class="meta">${displayPhone}<br/>${daysInShopChip(r)}</div>
      <div class="badge-cell">${flagBadge} ${timerBadge} <span class="badge ${r.status}">${STATUS_LABEL[r.status]}</span></div>
    </div>
  `;
}
function attentionRow(db, x) {
  const r = x.r;
  const c = db.customers.find(y => y.id === r.customer_id) || {};
  const alertText = x.alerts.map(a => a.text).join(' · ');
  const displayName = c.name || '(no name)';
  const displayItem = r.item_description || '(no item description)';
  const displayPhone = c.phone ? formatPhone(c.phone) : '—';
  return `
    <div class="row" data-rid="${r.id}">
      <div class="ticket">#${r.ticket}</div>
      <div class="who">
        ${escapeHtml(displayName)}
        <small>${escapeHtml(displayItem)}</small>
      </div>
      <div class="meta">${displayPhone}</div>
      <div class="badge-cell"><span class="badge alert">${alertText}</span></div>
    </div>
  `;
}

function renderDetail(id) {
  const db = loadDB();
  const r = db.repairs.find(x => x.id === id);
  if (!r) return go({ name: 'dashboard' });
  const c = db.customers.find(x => x.id === r.customer_id);
  const parts = db.parts.filter(p => p.repair_id === id);
  const labor = db.labor.filter(l => l.repair_id === id);
  const allNotes = db.notes.filter(n => n.repair_id === id)
    .sort((a,b) => Date.parse(b.created_at) - Date.parse(a.created_at));
  // Auto-generated system events (timer start/stop/cancel, status changes) clutter the call log.
  // Keep them in the DB for audit but hide from the customer-facing log unless toggled.
  const isSystemEvent = (n) => n.note_type === 'internal' && /^(.+ (started|stopped|cancelled) (work )?timer|Status changed:|Marked customer notified)/i.test(n.body || '');
  const showSystem = view.showSystemNotes === true;
  const notes = showSystem ? allNotes : allNotes.filter(n => !isSystemEvent(n));
  const hiddenSystemCount = allNotes.length - notes.length;
  const alerts = repairAlerts(r, parts);
  const pTotal = partsTotal(parts);
  // Cumulative-time billing for the whole repair
  const rawTotalMin = totalRawMinutes(notes, labor);
  const billableMin = billableMinutesFromTotal(rawTotalMin);
  const laborChargeDollars = (billableMin / 60) * (r.labor_rate || 60);
  const storageFee = storageFeeAccrued(r);
  const grand = laborChargeDollars + pTotal + (r.service_fee || 0) + storageFee;
  const sessionsForRepair = notes.filter(n => n.note_type === 'work_session');

          <strong>This repair is deleted.</strong> Deleted ${formatRelativeDateTime(r.deleted_at)}${r.deleted_by_name ? ' by ' + escapeHtml(r.deleted_by_name) : ''}.
          ${isOwner ? '<button id="undeleteBtn" class="btn small" style="margin-left:12px">Restore</button>' : '<span style="color:var(--ink-secondary);margin-left:8px">Ask Bryce if you need this restored.</span>'}
        </div>

            <h3>Labor &amp; billing <span class="actions"><button class="btn small secondary" id="addLabor">+ Add labor manually</button></span></h3>
            ${(sessionsForRepair.length || labor.length) ? `
              <div style="font-size:12px;text-transform:uppercase;letter-spacing:0.06em;color:var(--gray);margin-bottom:6px">Time logged</div>
              ${sessionsForRepair.map(n => `
                <div class="kv" style="display:flex;justify-content:space-between;align-items:center;gap:8px">

                  <div class="v" style="font-variant-numeric:tabular-nums;white-space:nowrap">${fmtMin(n.session_raw_minutes || 0)}</div>

                </div>
              `).join('')}
              ${labor.map(l => {
                const techStr = l.tech_name ? l.tech_name : (r.assigned_tech || 'Manual');
                return `
                <div class="kv" style="display:flex;justify-content:space-between;align-items:center;gap:8px">
                  <div class="k" style="margin:0;flex:1;min-width:0">${l.logged_at} · ${escapeHtml(techStr)} · manual${l.description ? ' · ' + escapeHtml(l.description) : ''}</div>
                  <div class="v" style="font-variant-numeric:tabular-nums;white-space:nowrap">${fmtMin(Math.round((l.hours||0)*60))}</div>
                  <div style="display:flex;gap:4px"><button class="btn small secondary" data-edit-labor="${l.id}" title="Edit entry" style="padding:4px 8px;font-size:11px">✎</button><button class="btn small secondary" data-del-labor="${l.id}" title="Remove entry" style="padding:4px 8px;font-size:11px;color:var(--signal-danger);border-color:var(--signal-danger)">×</button></div>
                </div>`;
              }).join('')}
            ` : '<div class="empty">No labor logged yet — start a timer above to track.</div>'}

            <div style="margin-top:12px; padding-top:10px; border-top:1px dashed var(--line); font-size:13px;">
              <div style="display:flex;justify-content:space-between"><span>Total worked (raw)</span><strong style="font-variant-numeric:tabular-nums">${fmtMin(rawTotalMin)}</strong></div>
              <div style="display:flex;justify-content:space-between"><span>Billable labor (min 30, round up 30)</span><strong style="font-variant-numeric:tabular-nums">${fmtMin(billableMin)}</strong></div>
              <div style="display:flex;justify-content:space-between"><span>Labor charge ($${(r.labor_rate||60).toFixed(0)}/hr)</span><strong>$${laborChargeDollars.toFixed(2)}</strong></div>
            </div>
            <div style="margin-top:10px; padding-top:10px; border-top:1px solid var(--line); font-size:14px;">
              <div style="display:flex;justify-content:space-between;color:var(--muted)"><span>Service fee</span><span>$${(r.service_fee||0).toFixed(2)}</span></div>
              <div style="display:flex;justify-content:space-between;color:var(--muted)"><span>Parts</span><span>$${pTotal.toFixed(2)}</span></div>
              <div style="display:flex;justify-content:space-between;color:var(--muted)"><span>Labor</span><span>$${laborChargeDollars.toFixed(2)}</span></div>
              ${storageFee > 0 ? `<div style="display:flex;justify-content:space-between;color:var(--amber)"><span>Storage fee (past 14-day pickup window)</span><span>$${storageFee.toFixed(2)}</span></div>` : ''}
              <div style="display:flex;justify-content:space-between;margin-top:6px;padding-top:6px;border-top:1px solid var(--line);font-weight:700;color:var(--text)">
                <span>Total</span><span>$${grand.toFixed(2)}</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  `;

  document.getElementById('back').onclick = (e) => { e.preventDefault(); go({ name: 'dashboard' }); };
  document.getElementById('status').onchange = (e) => {
    const newStatus = e.target.value;
    const db = loadDB();
    const rr = db.repairs.find(x => x.id === id);
    const oldStatus = rr.status;
    if (newStatus === oldStatus) return;

    // Confirm transitions to terminal states (easy to misclick on a tablet)
    if ((newStatus === 'picked' || newStatus === 'aband') && oldStatus !== newStatus) {
      const label = newStatus === 'picked' ? 'mark this repair Picked Up' : 'mark this repair Abandoned';
      if (!confirm(`Are you sure you want to ${label}? This is a terminal state.`)) {
        document.getElementById('status').value = oldStatus;
        return;
      }
    }

    rr.status = newStatus;
    const now = nowISO();
    // Write companion fields and a system note for any status transition
    if (newStatus === 'picked' && !rr.picked_up_date) rr.picked_up_date = todayISO();
    if (newStatus === 'aband' && !rr.abandoned_date) rr.abandoned_date = todayISO();
    if (newStatus === 'ready' && !rr.ready_notified_date) rr.ready_notified_date = todayISO();
    // Auto-email the customer when status flips to ready and they have email on file
    if (newStatus === 'ready' && oldStatus !== 'ready') {
      const cust = db.customers.find(x => x.id === rr.customer_id);
      if (cust && cust.email && !rr.pickup_emailed_at) {
        rr.pickup_emailed_at = nowISO(); // optimistic mark — real send is async
        db.notes.push({
          id: uid(), repair_id: id, note_type: 'internal',
          body: `📧 Pickup-ready notification auto-emailed to ${cust.email}`,
          author_name: 'System', created_at: nowISO(),
        });
        emailPickupReady(id);
      }
    }
    db.notes.push({
      id: uid(), repair_id: id, note_type: 'internal',
      body: `Status changed: ${STATUS_LABEL[oldStatus] || oldStatus} → ${STATUS_LABEL[newStatus]}`,
      author_name: currentUser().name, created_at: now,
    });
    saveDB(db); renderDetail(id);
  };
  const toggleSysBtn = document.getElementById('toggleSystem');
  if (toggleSysBtn) toggleSysBtn.onclick = () => { view.showSystemNotes = !view.showSystemNotes; renderDetail(id); };

  const deleteBtn = document.getElementById('deleteRepair');
  if (deleteBtn) deleteBtn.onclick = async () => {
    const r2 = loadDB().repairs.find(x => x.id === id);
    if (!r2) return;
    // First confirm
    if (!confirm(`Delete repair #${r2.ticket} (${r2.item_description || 'no description'})?\n\nThis moves it to the Deleted section.`)) return;
    // Second confirm — bigger warning
    if (!confirm(`⚠ ARE YOU SURE?\n\nThis is a real customer record. Notes, parts, signature, and work history will all be hidden from the dashboard.\n\nIt CAN be restored by Bryce — but you should be very sure before deleting.\n\nProceed?`)) return;
    const db2 = loadDB();
    const rr = db2.repairs.find(x => x.id === id);
    rr.deleted_at = nowISO();
    rr.deleted_by_name = currentUser().name;
    db2.notes.push({
      id: uid(), repair_id: id, note_type: 'internal',
      body: `Repair deleted by ${currentUser().name}.`,
      author_name: currentUser().name, created_at: nowISO(),
    });
    saveDB(db2);
    showToast('Repair #' + rr.ticket + ' deleted', 'success');
    go({ name: 'dashboard' });
  };

  const undeleteBtn = document.getElementById('undeleteBtn');
  if (undeleteBtn) undeleteBtn.onclick = async () => {
    const r2 = loadDB().repairs.find(x => x.id === id);
    if (!r2) return;
    if (currentUser().role !== 'owner') { alert('Owner only.'); return; }
    if (!confirm(`Restore repair #${r2.ticket}? It'll reappear in the dashboard.`)) return;
    const db2 = loadDB();
    const rr = db2.repairs.find(x => x.id === id);
    rr.deleted_at = null;
    rr.deleted_by_name = null;
    db2.notes.push({
      id: uid(), repair_id: id, note_type: 'internal',
      body: `Repair restored from deleted by ${currentUser().name}.`,
      author_name: currentUser().name, created_at: nowISO(),
    });
    saveDB(db2);
    showToast('Repair #' + rr.ticket + ' restored', 'success');
    renderDetail(id);
  };
  document.getElementById('logCall').onclick    = () => openNoteModal(id, 'outbound_call');
  document.getElementById('addNote').onclick    = () => openNoteModal(id, 'internal');
  document.getElementById('markNotified').onclick = () => {
    const db = loadDB();
    const rr = db.repairs.find(x => x.id === id);
    const wasReady = rr.status === 'ready';
    rr.ready_notified_date = todayISO();
    if (rr.status !== 'ready') rr.status = 'ready';
    db.notes.push({
      id: uid(), repair_id: id, note_type: 'outbound_call',
      body: 'Marked customer notified — pickup window starts.',
      author_name: currentUser().name, created_at: nowISO(),
    });
    // Auto-email the customer if they have email on file (don't double-send if already done)
    const cust = db.customers.find(x => x.id === rr.customer_id);
    if (cust && cust.email && !rr.pickup_emailed_at) {
      rr.pickup_emailed_at = nowISO();
      db.notes.push({
        id: uid(), repair_id: id, note_type: 'internal',
        body: `📧 Pickup-ready notification auto-emailed to ${cust.email}`,
        author_name: 'System', created_at: nowISO(),
      });
      emailPickupReady(id);
    }
    saveDB(db); renderDetail(id);
  };
  document.getElementById('addPart').onclick  = () => openPartModal(id);
  document.getElementById('addLabor').onclick = () => openLaborModal(id);

  // Edit / remove manual labor entries
  document.querySelectorAll('[data-edit-labor]').forEach(el => {
    el.onclick = () => openLaborEditModal(id, el.dataset.editLabor);
  });
  document.querySelectorAll('[data-del-labor]').forEach(el => {
    el.onclick = () => {
      const lid = el.dataset.delLabor;
      const db = loadDB();
      const l = db.labor.find(x => x.id === lid);
      if (!l) return;
      if (!confirm(`Remove this labor entry?\n\n${l.description || '(no description)'} — ${(l.hours||0)} hours\n\nThis will reduce the labor charge on the bill.`)) return;
      db.labor = db.labor.filter(x => x.id !== lid);
      saveDB(db);
      if (SUPABASE_ENABLED && sb) sb.from('labor_entries').delete().eq('id', lid).then(({ error }) => { if (error) console.error('Delete labor failed:', error); });
      renderDetail(id);
    };
  });
  // Edit / remove timer sessions (stored as notes with note_type='work_session')
  document.querySelectorAll('[data-edit-session]').forEach(el => {
    el.onclick = () => openSessionEditModal(id, el.dataset.editSession);
  });
  document.querySelectorAll('[data-del-session]').forEach(el => {
    el.onclick = () => {
      const nid = el.dataset.delSession;
      const db = loadDB();
      const n = db.notes.find(x => x.id === nid);
      if (!n) return;
      if (!confirm(`Remove this timer session?\n\n${n.author_name || ''} · ${n.session_raw_minutes || 0} min\n\nThis will reduce the labor charge on the bill.`)) return;
      db.notes = db.notes.filter(x => x.id !== nid);
      saveDB(db);
      if (SUPABASE_ENABLED && sb) sb.from('notes').delete().eq('id', nid).then(({ error }) => { if (error) console.error('Delete session failed:', error); });
      renderDetail(id);
    };
  });
  document.querySelectorAll('[data-mark-ordered]').forEach(el => {
    el.onclick = () => {
      const db = loadDB();
      const p = db.parts.find(x => x.id === el.dataset.markOrdered);
      p.ordered_date = todayISO();
      // Auto-advance status from 'intake'/'diag' to 'parts' when first part gets ordered
      const rr = db.repairs.find(x => x.id === id);
      if (rr && (rr.status === 'intake' || rr.status === 'diag')) {
        rr.status = 'parts';
        db.notes.push({ id: uid(), repair_id: id, note_type: 'internal', body: `Status auto-advanced to Awaiting Parts (first part marked ordered).`, author_name: currentUser().name, created_at: nowISO() });
      }
      saveDB(db); renderDetail(id);
    };
  });
  document.querySelectorAll('[data-mark-received]').forEach(el => {
    el.onclick = () => {
      const db = loadDB();
      const p = db.parts.find(x => x.id === el.dataset.markReceived);
      p.received_date = todayISO();
      saveDB(db); renderDetail(id);
    };
  });
  document.querySelectorAll('[data-mark-installed]').forEach(el => {
    el.onclick = () => {
      const db = loadDB();
      const p = db.parts.find(x => x.id === el.dataset.markInstalled);
      p.installed_date = todayISO();
      saveDB(db); renderDetail(id);
    };
  });
  document.querySelectorAll('[data-edit-part]').forEach(el => {
    el.onclick = () => openPartEditModal(id, el.dataset.editPart);
  });
  document.querySelectorAll('[data-del-part]').forEach(el => {
    el.onclick = async () => {
      const pid = el.dataset.delPart;
      const db = loadDB();
      const p = db.parts.find(x => x.id === pid);
      if (!p) return;
      if (!confirm(`Remove "${p.name}" from this repair?\n\nThis can't be undone (but you can re-add it).`)) return;
      // Remove from cache
      db.parts = db.parts.filter(x => x.id !== pid);
      saveDB(db);
      // Also delete on server (saveDB upserts but doesn't delete; do it explicitly)
      if (SUPABASE_ENABLED && sb) {
        sb.from('parts').delete().eq('id', pid).then(({ error }) => { if (error) console.error('Delete part failed:', error); });
      }
      renderDetail(id);
    };
  });

  // Reference manual wiring
  const addRef = document.getElementById('addRef');
  if (addRef) addRef.onclick = () => openRefModal(id);
  const addCustom = document.getElementById('addCustomModel');
  if (addCustom) addCustom.onclick = () => openCustomModelModal(id);
  const addCustomInline = document.getElementById('addCustomModelInline');
  if (addCustomInline) addCustomInline.onclick = () => openCustomModelModal(id);
  document.querySelectorAll('[data-del-ref]').forEach(el => {
    el.onclick = () => {
      const db = loadDB();
      const rr = db.repairs.find(x => x.id === id);
      const idx = parseInt(el.dataset.delRef, 10);
      rr.reference_links = (rr.reference_links || []).filter((_, i) => i !== idx);
      saveDB(db); renderDetail(id);
    };
  });

  // Timer wiring
  const startBtn = document.getElementById('startTimer');
  if (startBtn) startBtn.onclick = () => startTimer(id);
  const stopBtn  = document.getElementById('stopTimer');
  if (stopBtn)  stopBtn.onclick = () => openStopTimerModal(id);
  const cancelBtn = document.getElementById('cancelTimer');
  if (cancelBtn) cancelBtn.onclick = () => {
    if (!confirm('Cancel this timer without logging any labor? Elapsed time will be discarded.')) return;
    const db = loadDB();
    const u = currentUser();
    db.active_timers = db.active_timers.filter(t => !(t.repair_id === id && t.tech_id === u.id));
    db.notes.push({
      id: uid(), repair_id: id, note_type: 'internal',
      body: u.name + ' cancelled work timer (no labor logged).',
      author_name: u.name, created_at: nowISO(),
    });
    saveDB(db); renderDetail(id);
  };
  const goActive = document.getElementById('goToActive');
  if (goActive) goActive.onclick = (e) => {
    e.preventDefault();
    const db = loadDB();
    const u = currentUser();
    const t = activeTimerForUser(db, u.id);
    if (t) go({ name: 'detail', id: t.repair_id });
  };
}

function startTimer(repairId) {
  const db = loadDB();
  const u = currentUser();
  if (activeTimerForUser(db, u.id)) {
    alert('You already have a timer running on another repair. Stop that one first.');
    return;
  }
  db.active_timers.push({
    id: uid(), repair_id: repairId, tech_id: u.id, tech_name: u.name,
    started_at: new Date().toISOString(),
  });
  // Auto-advance status if it's still in early states
  const r = db.repairs.find(x => x.id === repairId);
  if (r && (r.status === 'intake' || r.status === 'diag' || r.status === 'parts')) r.status = 'repair';
  db.notes.push({
    id: uid(), repair_id: repairId, note_type: 'internal',
    body: u.name + ' started work timer.',
    author_name: u.name, created_at: nowISO(),
  });
  saveDB(db); renderDetail(repairId);
}

function openCustomModelModal(repairId) {
  const db = loadDB();
  const r = db.repairs.find(x => x.id === repairId);
  const wrap = document.createElement('div');
  wrap.className = 'modal-wrap';
  wrap.innerHTML = `
    <div class="modal" style="max-width:560px">
      <h3>Add custom model to shop catalog</h3>
      <div class="sub">For old, vintage, or odd vehicles not in the manufacturer lists. Once saved, future repairs that mention this brand/family will auto-link these references.</div>
      <div class="form-row">
        <div class="field"><label>Brand</label><input id="cmbrand" placeholder="e.g. Tamiya"/></div>
        <div class="field"><label>Family / model name</label><input id="cmfamily" placeholder="e.g. Hornet" value="${escapeHtml((r && r.item_description) ? r.item_description.split(',')[0] : '')}"/></div>
      </div>
      <div class="form-row" style="margin-top:8px">
        <div class="field"><label>SKU (optional)</label><input id="cmsku" placeholder="e.g. 58336"/></div>
        <div class="field"><label>Category (optional)</label><input id="cmcategory" placeholder="e.g. 1/10 2WD buggy"/></div>
      </div>
      <div class="field" style="margin-top:8px"><label>Exploded view URL</label><input id="cmexp" placeholder="https://..."/></div>
      <div class="field" style="margin-top:8px"><label>Manual URL (optional)</label><input id="cmman" placeholder="https://..."/></div>
      <div class="field" style="margin-top:8px"><label>Product page URL (optional)</label><input id="cmprod" placeholder="https://..."/></div>
      <div class="field" style="margin-top:8px"><label>Notes (optional)</label><input id="cmnotes" placeholder="e.g. Vintage 1980s buggy, parts via Tamiyaplaza"/></div>
      <div class="checkbox-row" style="margin-top:8px">
        <label><input type="checkbox" id="cmAlsoSave" checked> Also save the exploded-view link to this repair</label>
      </div>
      <div class="form-actions">
        <button class="btn secondary" id="cancel">Cancel</button>
        <button class="btn" id="save">Save to catalog</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);
  attachModalBehavior(wrap);
  wrap.querySelector('#cancel').onclick = () => wrap.remove();
  wrap.querySelector('#save').onclick = () => {
    const brand = wrap.querySelector('#cmbrand').value.trim();
    const family = wrap.querySelector('#cmfamily').value.trim();
    const exp = wrap.querySelector('#cmexp').value.trim();
    const manualUrl = wrap.querySelector('#cmman').value.trim();
    const prodUrl = wrap.querySelector('#cmprod').value.trim();
    if (!brand || !family || !exp) {
      alert('Brand, family, and exploded view URL are required.');
      return;
    }
    if (!isSafeHttpUrl(exp)) { alert('Exploded view URL must be a valid http:// or https:// URL.'); return; }
    if (manualUrl && !isSafeHttpUrl(manualUrl)) { alert('Manual URL must be a valid http:// or https:// URL.'); return; }
    if (prodUrl && !isSafeHttpUrl(prodUrl)) { alert('Product page URL must be a valid http:// or https:// URL.'); return; }
    const sku = wrap.querySelector('#cmsku').value.trim();
    const db2 = loadDB();
    db2.custom_catalog = db2.custom_catalog || [];
    db2.custom_catalog.push({
      id: 'custom_' + Math.random().toString(36).slice(2, 10),
      brand, family, sku,
      category: wrap.querySelector('#cmcategory').value.trim(),
      product_url: wrap.querySelector('#cmprod').value.trim(),
      exploded_view_url: exp,
      manual_url: wrap.querySelector('#cmman').value.trim(),
      notes: wrap.querySelector('#cmnotes').value.trim(),
      added_by: currentUser().name,
      added_at: new Date().toISOString(),
    });
    if (wrap.querySelector('#cmAlsoSave').checked) {
      const rr = db2.repairs.find(x => x.id === repairId);
      rr.reference_links = rr.reference_links || [];
      rr.reference_links.push({ url: exp, label: `${brand} ${family} exploded view` });
    }
    saveDB(db2); wrap.remove(); renderDetail(repairId);
  };
}

function openRefModal(repairId) {
  const wrap = document.createElement('div');
  wrap.className = 'modal-wrap';
  wrap.innerHTML = `
    <div class="modal">
      <h3>Save a reference link</h3>
      <div class="sub">Paste the URL of an exploded view, manual, or how-to. It'll stay attached to this repair so any tech can open it.</div>
      <div class="field"><label>URL</label><input id="rurl" placeholder="https://traxxas.com/.../slash-4x4-manual.pdf"/></div>

      <div class="form-actions">
        <button class="btn secondary" id="cancel">Cancel</button>
        <button class="btn" id="save">Save link</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);
  attachModalBehavior(wrap);
  wrap.querySelector('#cancel').onclick = () => wrap.remove();
  wrap.querySelector('#save').onclick = () => {
    const url = wrap.querySelector('#rurl').value.trim();
    const lbl = wrap.querySelector('#rlbl').value.trim();
    if (!isSafeHttpUrl(url)) {
      alert('Please paste a valid http:// or https:// URL.');
      wrap.querySelector('#rurl').focus();

  };
}

function openStopTimerModal(repairId) {
  const db = loadDB();
  const u = currentUser();
  const timer = activeTimerForRepair(db, repairId);
  if (!timer || timer.tech_id !== u.id) return;
  const ms = elapsedMs(timer);
  const rate = 60;
  const elapsedStr = fmtElapsed(ms);
  const sessionMin = Math.max(1, Math.round(ms / 60000));

  const existingNotes = db.notes.filter(n => n.repair_id === repairId);
  const existingLabor = db.labor.filter(l => l.repair_id === repairId);
  const priorRaw = totalRawMinutes(existingNotes, existingLabor);
  const newTotalRaw = priorRaw + sessionMin;
  const priorBillable = billableMinutesFromTotal(priorRaw);
  const newBillable = billableMinutesFromTotal(newTotalRaw);
  const addedBillable = Math.max(0, newBillable - priorBillable);
  const newDollars = (newBillable / 60) * rate;

  const wrap = document.createElement('div');
  wrap.className = 'modal-wrap';
  wrap.innerHTML = `
    <div class="modal">
      <h3>Stop timer &amp; log session</h3>
      <div class="sub">This session's actual time is logged. Customer labor charge uses the cumulative total: minimum 30 min, then rounded up to the next 30 min at $${rate}/hr.</div>
      <div class="preview-box" style="margin:8px 0 14px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
          <div class="kv" style="margin:0"><div class="k">This session</div><div class="v" style="font-variant-numeric:tabular-nums">${elapsedStr} (${sessionMin} min)</div></div>
          <div class="kv" style="margin:0;text-align:right"><div class="k">Cumulative on this repair</div><div class="v" style="font-variant-numeric:tabular-nums"><strong>${newTotalRaw} min</strong> ${priorRaw>0 ? '(was ' + priorRaw + ' min)' : ''}</div></div>
        </div>
        <hr style="border:0;border-top:1px dashed var(--line);margin:8px 0"/>
        <div style="display:flex;justify-content:space-between;align-items:baseline">

/**
 * Hook up an HTML5 canvas as a signature pad. Returns an object with helpers.
 * Customer signs with finger or stylus; signature is captured as a base64 data URL.
 */
function attachSignaturePad(canvas) {
  const ctx = canvas.getContext('2d');
  // Resize canvas to its actual rendered size for crisp lines on high-DPR screens
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#1d2330';
  }
  resize();
  let isDrawing = false;
  let hasInk = false;
  let lastX = 0, lastY = 0;
  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }
  function start(e) {
    e.preventDefault();
    isDrawing = true;
    const p = getPos(e);
    lastX = p.x; lastY = p.y;
  }
  function move(e) {
    if (!isDrawing) return;
    e.preventDefault();
    const p = getPos(e);
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    lastX = p.x; lastY = p.y;
    if (!hasInk) { hasInk = true; canvas.classList.add('signed'); }
  }
  function end() { isDrawing = false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('mouseleave', end);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove',  move,  { passive: false });
  canvas.addEventListener('touchend',   end);
  return {
    clear() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      hasInk = false;
      canvas.classList.remove('signed');
    },
    isEmpty() { return !hasInk; },
    toDataURL() {
      if (!hasInk) return null;
      // Composite the signature onto a white background so email-client dark-mode
      // doesn't render dark ink on a dark background.
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = canvas.width;
      exportCanvas.height = canvas.height;
      const ex = exportCanvas.getContext('2d');
      ex.fillStyle = '#FFFFFF';
      ex.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
      ex.drawImage(canvas, 0, 0);
      return exportCanvas.toDataURL('image/png');
    },
  };
}

/**
 * Generic typeahead autocomplete for any text input.
 * @param {HTMLInputElement} input - the input element to enhance
 * @param {(query: string) => Array} getSuggestions - returns up to ~8 {label, sub, ...payload} items
 * @param {(item) => void} onSelect - called with the chosen item
 * @param {{customLabel?: string}} opts - optional configuration (custom-footer label)
 */
function attachAutocomplete(input, getSuggestions, onSelect, opts) {
  opts = opts || {};
  const wrap = input.parentElement;
  if (!wrap) return;
  if (!wrap.classList.contains('ac-wrap')) wrap.classList.add('ac-wrap');
  let dropdown = null;
  let activeIndex = -1;
  let currentItems = [];

  function close() {
    if (dropdown) { dropdown.remove(); dropdown = null; }
    activeIndex = -1;
    currentItems = [];
  }

  function render(suggestions) {
    close();
    if (!suggestions || !suggestions.length) return;
    currentItems = suggestions;
    dropdown = document.createElement('div');
    dropdown.className = 'ac-dropdown';
    suggestions.forEach((s, i) => {
      const item = document.createElement('div');
      item.className = 'ac-item' + (s.isCustom ? ' custom' : '');
      if (s.isCustom) {
        item.textContent = s.label;
      } else {
        item.innerHTML =
          `<span class="label">${escapeHtml(s.label)}</span>` +
          (s.sub ? `<span class="sub">${escapeHtml(s.sub)}</span>` : '');
      }
      // mousedown fires before input blur, so we don't lose the click
      item.onmousedown = (e) => {
        e.preventDefault();
        if (s.isCustom) { close(); input.focus(); return; }
        onSelect(s);
        close();
      };
      dropdown.appendChild(item);
    });
    wrap.appendChild(dropdown);
  }

  function refresh() {
    const q = input.value || '';
    let suggestions = getSuggestions(q) || [];
    suggestions = suggestions.slice(0, 8);
    if (q.trim().length > 0) {
      suggestions.push({ isCustom: true, label: opts.customLabel || '+ Custom (none of the above)' });
    }
    render(suggestions);
  }

  input.addEventListener('input', refresh);
  input.addEventListener('focus', refresh);
  input.addEventListener('blur', () => { setTimeout(close, 150); });
  input.addEventListener('keydown', (e) => {
    if (!dropdown) return;
    if (e.key === 'Escape') { close(); return; }
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      activeIndex = Math.min(currentItems.length - 1, activeIndex + 1);
      [...dropdown.children].forEach((el, i) => el.classList.toggle('active', i === activeIndex));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      activeIndex = Math.max(0, activeIndex - 1);
      [...dropdown.children].forEach((el, i) => el.classList.toggle('active', i === activeIndex));
    } else if (e.key === 'Enter' && activeIndex >= 0) {
      e.preventDefault();
      const s = currentItems[activeIndex];
      if (s && !s.isCustom) { onSelect(s); }
      close();
    }
  });
}

// Make any modal close on Esc + backdrop click + Enter-to-save. Call after appending the wrap.
function attachModalBehavior(wrap) {
  const close = () => wrap.remove();
  // Backdrop click (only when target is the wrapper itself, not the inner modal)
  wrap.addEventListener('click', (e) => { if (e.target === wrap) close(); });
  // Esc to close
  const onKey = (e) => {
    if (e.key === 'Escape') { close(); document.removeEventListener('keydown', onKey); }
    if (e.key === 'Enter' && !(e.target.tagName === 'TEXTAREA')) {
      const saveBtn = wrap.querySelector('#save');
      if (saveBtn) { e.preventDefault(); saveBtn.click(); }
    }
  };
  document.addEventListener('keydown', onKey);
  // Auto-focus first input
  setTimeout(() => {
    const first = wrap.querySelector('input, textarea, select');
    if (first) first.focus();
  }, 0);
  // Clean up listener when modal removed
  const observer = new MutationObserver(() => {
    if (!document.body.contains(wrap)) {
      document.removeEventListener('keydown', onKey);
      observer.disconnect();
    }
  });
  observer.observe(document.body, { childList: true });
}

function isSafeHttpUrl(url) {
  if (!url) return false;
  try {
    const u = new URL(url);
    return u.protocol === 'http:' || u.protocol === 'https:';
  } catch (_) { return false; }
}

function detectBrand(itemDesc) {
  const s = (itemDesc || '').toLowerCase();
  if (s.includes('traxxas')) return 'traxxas';
  if (s.includes('arrma'))   return 'arrma';
  if (s.includes('losi'))    return 'losi';
  if (s.includes('axial'))   return 'axial';
  if (s.includes('kyosho'))  return 'kyosho';
  if (s.includes('tamiya'))  return 'tamiya';
  if (s.includes('redcat'))  return 'redcat';
  return null;
}
function modelGuess(itemDesc) {
  // Strip the brand and strip trailing serial/sn/color words to get a useful query
  let s = (itemDesc || '').replace(/(traxxas|arrma|losi|axial|redcat)/i, '').trim();
  s = s.replace(/,?\s*sn\s*\S+/i, '');
  s = s.replace(/\b(blue|red|black|white|green|yellow|orange|silver|gray|grey)\b/gi, '');
  s = s.replace(/\s+/g, ' ').replace(/^[,\s]+|[,\s]+$/g, '');
  return s;
}

    p2.received_date = wrap.querySelector('#ep-received').value || null;
    p2.installed_date= wrap.querySelector('#ep-installed').value|| null;
    saveDB(db2);
    wrap.remove();
    renderDetail(repairId);
  };

// ---------------- Intake ----------------
function renderIntake() {
  const db = loadDB();
  const ticket = db.nextTicket;
  $root.innerHTML = `
    <div class="app">
      <a href="#" class="back-link" id="back">&larr; Cancel and go back</a>
      <div class="form-card">
        <h2>New repair &middot; #${ticket}</h2>
        <div class="sub">Replaces the paper clipboard. Fill in whatever you have — no fields are required.</div>

        <div class="form-section">
          <h3>Customer</h3>
          <div class="form-row">
            <div class="field"><label>Phone</label><input id="phone" placeholder="502-555-0142"/></div>
            <div class="field"><label>Name</label><input id="name" placeholder="Jane Doe"/></div>
          </div>
          <div class="field" style="margin-top:8px"><label>Email</label><input id="email" placeholder="jane@example.com"/></div>
        </div>

        <div class="form-section">
          <h3>Item</h3>
          <div class="form-row">
            <div class="field"><label>Type</label>
              <select id="itype">
                <option value="rc_vehicle">RC vehicle</option>
                <option value="boat">Boat</option>
                <option value="helicopter">Helicopter</option>
                <option value="plane">Plane</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="field"><label>Description</label><input id="idesc" placeholder="Traxxas Slash 4x4, blue, sn 47281"/></div>
          </div>
          <div class="checkbox-row" style="margin-top:10px">
            <label><input type="checkbox" id="trans" checked> Transmitter included</label>
            <label><input type="checkbox" id="batt"> Battery included</label>
            <label><input type="checkbox" id="charge"> Charger included</label>
          </div>
        </div>

        <div class="form-section">
          <h3>Issue</h3>
          <div class="field"><textarea id="issue" placeholder="Customer’s description of what’s wrong, and what they want done."></textarea></div>
        </div>

        <div class="form-section">
          <h3>Parts</h3>
          <div class="radio-block">
            <label class="active" id="psrc-shop"><input type="radio" name="psrc" value="shop" checked> Shop will source any parts needed</label>
            <label id="psrc-cust"><input type="radio" name="psrc" value="cust"> Customer brought their own parts</label>
            <label id="psrc-spec"><input type="radio" name="psrc" value="spec"> Shop must special-order something not in stock</label>
          </div>
        </div>

        <div class="form-section">
          <h3>Repair policy</h3>
          <div class="policy-box">
            <strong>HobbyTown Louisville Repair Policy.</strong>
            All repairs incur a minimum <strong>$30 service fee</strong> which includes diagnostic and up to 30 minutes of labor.
            Repair labor is <strong>$60/hour, billed in half-hour increments</strong>, plus parts.
            Repairs must be picked up within <strong>14 days</strong> of notification that the repair is complete.
            After 14 days, a <strong>$10/week storage fee</strong> is added.
            After <strong>60 days</strong> of not picking up your repair, it is considered abandoned and becomes property of HobbyTown Louisville.
          </div>
          <div class="checkbox-row" style="margin-top:10px">
            <label><input type="checkbox" id="agree"> Customer was shown this policy and agrees to it. (optional)</label>
          </div>
          <div class="field" style="margin-top:8px">
            <label>Customer signature — type name</label>
            <input id="sig" placeholder="Customer types their name"/>
            <div id="sigPreview" class="sig-preview empty">
              <span class="sig-preview-name">— signature appears here —</span>
              <span class="sig-preview-hint">cursive preview</span>
            </div>
          </div>
          <div class="sig-wrap">
            <label style="display:block;font-size:12px;font-weight:600;color:var(--gray);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.04em">Or draw signature</label>
            <canvas id="sigCanvas" class="sig-canvas" width="900" height="150"></canvas>
            <div class="sig-actions">
              <button type="button" class="btn small secondary" id="sigClear">Clear drawn signature</button>
              <span class="hint">Either typed name or drawn signature counts. We'll auto-email a copy of the signed waiver if customer email is on the form.</span>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button class="btn secondary" id="cancel">Cancel</button>
          <button class="btn" id="save">Save and create repair</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('back').onclick = (e) => { e.preventDefault(); go({ name: 'dashboard' }); };
  document.getElementById('cancel').onclick = () => go({ name: 'dashboard' });

  // ---- Signature pad + cursive preview ----
  const sigCanvas = document.getElementById('sigCanvas');
  const sigPad = sigCanvas ? attachSignaturePad(sigCanvas) : null;
  const sigClearBtn = document.getElementById('sigClear');
  if (sigClearBtn) sigClearBtn.onclick = () => sigPad && sigPad.clear();
  const sigInput = document.getElementById('sig');
  const sigPreview = document.getElementById('sigPreview');
  const sigPreviewName = sigPreview ? sigPreview.querySelector('.sig-preview-name') : null;
  if (sigInput && sigPreview && sigPreviewName) {
    sigInput.addEventListener('input', () => {
      const name = sigInput.value.trim();
      if (name) {
        sigPreviewName.textContent = name;
        sigPreview.classList.remove('empty');
      } else {
        sigPreviewName.textContent = '— signature appears here —';
        sigPreview.classList.add('empty');
      }
    });
  }

  // ---- Autocomplete: phone, name, item description ----
  const dbForAC = loadDB();
  const inputPhone = document.getElementById('phone');
  const inputName  = document.getElementById('name');
  const inputEmail = document.getElementById('email');
  const inputIDesc = document.getElementById('idesc');
  const inputIType = document.getElementById('itype');

  // Phone field — match by digits, fill name + email when picked
  attachAutocomplete(inputPhone,
    (q) => {
      const digits = (q || '').replace(/\D/g, '');
      if (digits.length < 2) return [];
      return dbForAC.customers
        .filter(c => c.phone && c.phone.includes(digits))
        .map(c => ({
          label: c.name || '(no name on file)',
          sub: formatPhone(c.phone) + (c.email ? ' · ' + c.email : ''),
          customer: c
        }));
    },
    (s) => {
      inputPhone.value = formatPhone(s.customer.phone);
      if (s.customer.name) inputName.value = s.customer.name;
      if (s.customer.email) inputEmail.value = s.customer.email;
    },
    { customLabel: '+ Custom (new customer)' }
  );

  // Name field — match by name, fill phone + email when picked
  attachAutocomplete(inputName,
    (q) => {
      const ql = (q || '').trim().toLowerCase();
      if (ql.length < 2) return [];
      return dbForAC.customers
        .filter(c => c.name && c.name.toLowerCase().includes(ql))
        .map(c => ({
          label: c.name,
          sub: formatPhone(c.phone) + (c.email ? ' · ' + c.email : ''),
          customer: c
        }));
    },
    (s) => {
      inputName.value = s.customer.name;
      inputPhone.value = formatPhone(s.customer.phone);
      if (s.customer.email) inputEmail.value = s.customer.email;
    },
    { customLabel: '+ Custom (new customer)' }
  );

  // Item description — match against the 296-model catalog, fill description + item type
  attachAutocomplete(inputIDesc,
    (q) => {
      if ((q || '').trim().length < 2) return [];
      return matchModelsForRepair(q).map(m => ({
        label: `${m.brand} · ${m.family}`,
        sub: (m.sku ? m.sku + ' · ' : '') + (m.category || ''),
        model: m
      }));
    },
    (s) => {
      inputIDesc.value = `${s.model.brand} ${s.model.family}` + (s.model.sku ? ` (${s.model.sku})` : '');
      // Auto-detect item type from category
      const cat = (s.model.category || '').toLowerCase();
      if (cat.includes('boat') || cat.includes('watercraft') || cat.includes('yacht') || cat.includes('surfer')) inputIType.value = 'boat';
      else if (cat.includes('helicopter') || cat.includes('heli')) inputIType.value = 'helicopter';
      else if (cat.includes('plane') || cat.includes('aero') || cat.includes('quadcopter') || cat.includes('drone')) inputIType.value = 'plane';
      else if (cat.includes('motorcycle') || cat.includes('moto') || cat.includes('bike')) inputIType.value = 'other';
      else inputIType.value = 'rc_vehicle';
    },
    { customLabel: '+ Custom (vintage / not in catalog)' }
  );
  document.querySelectorAll('input[name="psrc"]').forEach(r => {
    r.onchange = () => {
      ['psrc-shop','psrc-cust','psrc-spec'].forEach(id => document.getElementById(id).classList.remove('active'));
      document.getElementById('psrc-' + r.value).classList.add('active');
    };
  });
  document.getElementById('save').onclick = () => {
    const db = loadDB();
    let phone = document.getElementById('phone').value.replace(/\D/g, '');
    // Strip leading 1 if 11 digits (e.g. "15025550142" -> "5025550142")
    if (phone.length === 11 && phone.startsWith('1')) phone = phone.slice(1);
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const idesc = document.getElementById('idesc').value.trim();
    // No required fields — let staff save whatever they have.

    let c = null;
    if (phone) {
      // Only dedupe by phone when a phone was actually entered
      c = db.customers.find(x => x.phone === phone);
    }
    if (!c) {
      c = { id: uid(), name: name || null, phone: phone || null, email: email || null };
      db.customers.push(c);
    } else if (name && c.name && c.name.toLowerCase() !== name.toLowerCase()) {
      // Existing phone with a DIFFERENT name typed — confirm rather than silently keeping old
      const choice = confirm(
        `This phone number is already on file under "${c.name}".\n\n` +
        `Click OK to UPDATE the customer's name to "${name}".\n` +
        `Click Cancel to KEEP the existing name "${c.name}" and attach this repair to that customer.`
      );
      if (choice) {
        c.name = name;
        if (email) c.email = email;
      }
    } else {
      if (!c.name && name) c.name = name;
      if (!c.email && email) c.email = email;
    }
    const psrc = document.querySelector('input[name="psrc"]:checked').value;
    const id = uid();
    db.repairs.push({
      id, ticket, customer_id: c.id,
      dropoff_date: todayISO(),
      dropoff_at: nowISO(),
      item_type: document.getElementById('itype').value,
      item_description: idesc,
      transmitter_included: document.getElementById('trans').checked,
      battery_included: document.getElementById('batt').checked,
      charger_included: document.getElementById('charge').checked,
      issue_description: document.getElementById('issue').value.trim(),
      status: 'intake',
      customer_supplied_parts: psrc === 'cust',
      special_order_required: psrc === 'spec',
      service_fee: 30, labor_rate: 60,
      ready_notified_date: null, picked_up_date: null,
      assigned_tech: currentUser().name,
      reference_links: [],
      // Policy snapshot: store the EXACT policy text the customer agreed to,
      // so future edits to the global policy don't change historical agreements
      policy_version: POLICY_VERSION,
      policy_text_snapshot: POLICY_TEXT,
      policy_signed_name: document.getElementById('sig').value.trim() || null,
      policy_signature_image: (sigPad && !sigPad.isEmpty()) ? sigPad.toDataURL() : null,
      policy_acknowledged_by: currentUser().name,
      policy_acknowledged_at: nowISO(),
    });
    db.notes.push({
      id: uid(), repair_id: id, note_type: 'internal',
      body: `Intake by ${currentUser().name}. Customer signed policy${document.getElementById('sig').value.trim() ? ' (typed: ' + document.getElementById('sig').value.trim() + ')' : ''}.`,
      author_name: currentUser().name, created_at: nowISO(),
    });
    // Auto-email customer a copy of their signed waiver when we have both signature evidence + their email.
    const sigName = document.getElementById('sig').value.trim();
    const sigImage = sigPad && !sigPad.isEmpty();
    const customerEmail = (c.email || email || '').trim();
    if (customerEmail && (sigName || sigImage)) {
      db.notes.push({
        id: uid(), repair_id: id, note_type: 'internal',
        body: `📧 Signed waiver auto-emailed to ${customerEmail} (policy v${POLICY_VERSION} + signature on file).`,
        author_name: 'System', created_at: nowISO(),
      });
      // Real backend hook — fires the send-signed-waiver Edge Function (no-op when SUPABASE_ENABLED is false)
      emailSignedWaiver(id);
    }
    db.nextTicket = ticket + 1;
    saveDB(db);
    go({ name: 'detail', id });
  };
}

// ---------------- Helpers ----------------
function showToast(msg, kind) {
  const existing = document.getElementById('global-toast');
  if (existing) existing.remove();
  const t = document.createElement('div');
  t.id = 'global-toast';
  t.textContent = msg;
  const color = kind === 'error' ? '#A8412E' : (kind === 'success' ? '#3F7D58' : '#2C5F8E');
  t.style.cssText = 'position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:9999;background:#fff;color:' + color + ';border:1px solid ' + color + ';padding:12px 20px;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,0.15);font-size:14px;max-width:600px;line-height:1.4;cursor:pointer;';
  t.onclick = () => t.remove();
  document.body.appendChild(t);
  setTimeout(() => t.remove(), kind === 'error' ? 10000 : 4000);
}
function escapeHtml(s) { return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatPhone(p) { if (!p) return ''; return p.length===10 ? `(${p.slice(0,3)}) ${p.slice(3,6)}-${p.slice(6)}` : p; }
function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}
function formatRelativeDateTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const startOfDay = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate());
  const dayDiff = Math.round((startOfDay(now) - startOfDay(d)) / 86400000);
  const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  if (dayDiff === 0) return `Today at ${time}`;
  if (dayDiff === 1) return `Yesterday at ${time}`;
  if (dayDiff > 1 && dayDiff < 7) {
    const weekday = d.toLocaleDateString([], { weekday: 'long' });
    return `${weekday} at ${time}`;
  }
  return d.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}
// "2026-05-08" → "5.8.26" (M.D.YY) — friendlier policy version display
function formatPolicyVersion(v) {
  if (!v) return '';
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v);
  if (!m) return v;
  return `${parseInt(m[2],10)}.${parseInt(m[3],10)}.${m[1].slice(2)}`;
}

function formatRelativeDay(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const startOfDay = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate());
  const dayDiff = Math.round((startOfDay(now) - startOfDay(d)) / 86400000);
  if (dayDiff === 0) return 'today';
  if (dayDiff === 1) return 'yesterday';
  if (dayDiff > 1 && dayDiff < 7) return d.toLocaleDateString([], { weekday: 'long' });
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}

// ---------------- Live clock tick ----------------
setInterval(() => {
  ['liveClock','liveClockBusy'].forEach(eid => {
    const el = document.getElementById(eid);
    if (!el) return;
    const started = el.getAttribute('data-started');
    if (!started) return;
    const ms = Date.now() - new Date(started).getTime();
    el.textContent = fmtElapsed(ms);
    if (eid === 'liveClock') {
      if (ms > 4 * 3600 * 1000) el.classList.add('warn');
    }
  });
}, 1000);

// ---------------- Cross-tab sync ----------------
// When another tab writes to the shared DB, re-render so the user sees the latest state
window.addEventListener('storage', (e) => {
  if (e.key === KEY || e.key === SESSION_KEY) render();
});

// ---------------- Supabase boot ----------------
async function refreshCurrentUserFromSupabase() {
  if (!sb) return null;
  const { data: { user } } = await sb.auth.getUser();
  if (!user) { setUser(null); return null; }
  // Look up staff_profiles to get role + full name. If not in staff_profiles → not authorized.
  // Use SECURITY DEFINER RPC so RLS can't accidentally block self-lookup
  const { data: rows, error } = await sb.rpc('get_my_profile');
  if (error) { console.error('get_my_profile RPC failed:', error); }
  const profile = (rows && rows.length) ? rows[0] : null;
  if (!profile || !profile.is_active) {
    console.warn('Profile lookup result:', { user_id: user.id, profile, error });
    setUser(null);
    await sb.auth.signOut();
    setTimeout(() => alert('Your email isn\'t set up as active staff yet. Ask the shop owner to add you.\n\n(user.id = ' + user.id + ')'), 100);
    return null;
  }
  setUser({ id: user.id, email: user.email, name: profile.full_name, role: profile.role });
  return _currentUser;
}

async function bootSupabase() {
  if (!SUPABASE_ENABLED) { render(); return; }
  if (!window.supabase) { console.warn('Supabase SDK failed to load'); render(); return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // 1) Restore existing session (handles magic-link callback automatically)
  await refreshCurrentUserFromSupabase();

  // 2) If logged in, pull DB. If not, show login.
  if (_currentUser) {
    try { await pullDBFromSupabase(); } catch (e) { console.error('Initial DB pull failed:', e); }
  }
  render();

  // 3) Subscribe to auth state changes (so magic-link return re-renders)
  sb.auth.onAuthStateChange(async (event) => {
    if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') {
      await refreshCurrentUserFromSupabase();
      if (_currentUser) {
        try { await pullDBFromSupabase(); } catch (e) { console.error('Post-login DB pull failed:', e); }
      }
      render();
    } else if (event === 'SIGNED_OUT') {
      setUser(null);
      render();
    }
  });

  // 4) Polling-based cross-device sync (every 8 seconds).
  //    Not as instant as websocket realtime, but reliable and CSP-friendly.
  if (_currentUser) {
    let _pullInFlight = false;
    setInterval(async () => {
      if (_pullInFlight || !_currentUser) return;
      // CRITICAL: never re-render while the user is typing — kills their text + focus
      const active = document.activeElement;
      if (active && ['INPUT','TEXTAREA','SELECT'].includes(active.tagName)) return;
      // Don't poll-render if a modal is open (user is mid-interaction)
      if (document.querySelector('[id^="global-"]') || document.querySelector('.modal-open')) return;
      _pullInFlight = true;
      try {
        const before = JSON.stringify({
          repairs: _dbCache.repairs.length,
          notes: _dbCache.notes.length,
          parts: _dbCache.parts.length,
          timers: _dbCache.active_timers.length,
        });
        await pullDBFromSupabase();
        const after = JSON.stringify({
          repairs: _dbCache.repairs.length,
          notes: _dbCache.notes.length,
          parts: _dbCache.parts.length,
          timers: _dbCache.active_timers.length,
        });
        if (before !== after) render();
      } catch (e) {
        console.error('Poll-sync failed:', e);
      } finally { _pullInFlight = false; }
    }, 8000);
    console.log('Poll-sync running (8s interval)');
  }
}

// ---------------- Boot ----------------
// In production, bootSupabase() drives the whole sequence: restore session → pull data → render.
// If Supabase is disabled (placeholder credentials), it falls back to render() immediately.
bootSupabase();
</script>
