<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HobbyTown Repairs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Caveat:wght@500&family=Lilita+One&display=swap">
<script>
  // Apply saved theme BEFORE first paint to avoid the bright-flash-on-load
  (function() {
    var saved = null;
    try { saved = localStorage.getItem('hobbytown.theme'); } catch (e) {}
    if (!saved || !['warm','dark'].includes(saved)) {
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      saved = prefersDark ? 'dark' : 'warm';
    }
    document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
<style>
  :root {
    /* ---- Surfaces ---- */
    --surface-canvas:  #F6F5F2;          /* warm off-white page bg */
    --surface-1:       #FFFFFF;          /* cards, panels */
    --surface-2:       #FAF9F6;          /* nested zones (note rows, part cards) */
    --surface-sunken:  #EFEDE7;          /* dividers, dense form bg */
    --scrim:           rgba(28, 26, 24, 0.45);

    /* ---- Ink (text) ---- */
    --ink-primary:     #1C1A18;
    --ink-secondary:   #4A4744;
    --ink-tertiary:    #7A7672;
    --ink-disabled:    #B5B1AC;
    --ink-on-accent:   #FFFFFF;

    /* ---- Lines ---- */
    --line-soft:       #E8E5DF;
    --line-strong:     #D6D2CB;

    /* ---- Accent (calm slate-blue, not retail red) ---- */
    --accent:          #2C5F8E;
    --accent-hover:    #244E76;
    --accent-pressed:  #1C3D5E;
    --accent-tint:     #E8EEF5;

    /* ---- Brand (HobbyTown red — preserved for the logomark only) ---- */
    --brand-red:       #DB0032;
    --brand-red-shadow:#CF0A2C;

    /* ---- Signal palette — meaning, not decoration ---- */
    --signal-success:      #3F7D58;
    --signal-success-tint: #E6EFE9;
    --signal-warn:         #B07A1F;
    --signal-warn-tint:    #F4ECDC;
    --signal-danger:       #A8412E;
    --signal-danger-tint:  #F1E0DB;
    --signal-info:         #3B6F8F;
    --signal-info-tint:    #E2ECF1;
    --signal-mute:         #6B6863;
    --signal-mute-tint:    #ECEAE5;

    /* ---- Shadows (soft, never punchy) ---- */
    --shadow-sm:  0 1px 2px rgba(28, 26, 24, 0.04);
    --shadow-md:  0 2px 6px rgba(28, 26, 24, 0.06), 0 1px 2px rgba(28, 26, 24, 0.04);
    --shadow-lg:  0 8px 24px rgba(28, 26, 24, 0.10), 0 2px 6px rgba(28, 26, 24, 0.06);

    /* ---- Spacing scale ---- */
    --s-1: 4px;
    --s-2: 8px;
    --s-3: 12px;
    --s-4: 16px;
    --s-5: 24px;
    --s-6: 32px;
    --s-7: 48px;

    /* ---- Border radius ---- */
    --radius-xs: 4px;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-pill: 999px;

    /* ---- Legacy aliases (so JS template-string class names that haven't been migrated yet still work) ---- */
    --bg: var(--surface-canvas);
    --card: var(--surface-1);
    --line: var(--line-soft);
    --text: var(--ink-primary);
    --muted: var(--ink-secondary);
    --gray: var(--ink-secondary);
    --gray-bg: var(--surface-sunken);
    --green: var(--signal-success);
    --green-bg: var(--signal-success-tint);
    --amber: var(--signal-warn);
    --amber-bg: var(--signal-warn-tint);
    --red: var(--accent);            /* old "danger" buttons now reuse accent — danger gets explicit class */
    --red-bg: var(--signal-danger-tint);
    --blue: var(--accent);
    --blue-bg: var(--accent-tint);
    --navy: var(--ink-primary);
  }
  /* The default :root values above are the LIGHT (warm) theme — paper-warm off-white, calm/forgiving.
     [data-theme="warm"] is intentionally empty — it just makes the toggle's data attribute meaningful. */
  [data-theme="warm"] { /* inherits :root */ }

  /* ---------- DARK theme (per design-agent spec — surfaces step UP with elevation) ---------- */
  [data-theme="dark"] {
    --surface-canvas:  #15171A;          /* deepest layer */
    --surface-1:       #1B1E22;          /* cards, panels — one step up */
    --surface-2:       #23272D;          /* popovers, hovered cards */
    --surface-sunken:  #101214;          /* recessed inputs */
    --scrim:           rgba(8, 9, 11, 0.66);

    --ink-primary:     #E8E6E1;          /* off-white, no halation */
    --ink-secondary:   #B5B2AC;
    --ink-tertiary:    #807E78;
    --ink-disabled:    #555550;
    --ink-on-accent:   #F5F5F2;

    /* Borders are LIGHTER than the surface they sit on (translucent overlays) */
    --line-soft:       rgba(255, 250, 240, 0.07);
    --line-strong:     rgba(255, 250, 240, 0.14);

    /* Accent lifted along LCH for AA contrast on dark surfaces */
    --accent:          #6FA3D1;
    --accent-hover:    #84B5DF;
    --accent-pressed:  #5C90BC;
    --accent-tint:     rgba(111, 163, 209, 0.14);

    /* Brand red lifted slightly — same emotional register, won't burn at midnight */
    --brand-red:       #E83A5C;
    --brand-red-shadow:#D43253;

    /* Signal colors desaturated ~25% but still semantic; tints are translucent washes */
    --signal-success:      #5FBF8A;
    --signal-success-tint: rgba(95, 191, 138, 0.12);
    --signal-warn:         #E8B355;
    --signal-warn-tint:    rgba(232, 179, 85, 0.13);
    --signal-danger:       #E87A6E;          /* coral, not brand red */
    --signal-danger-tint:  rgba(232, 122, 110, 0.13);
    --signal-info:         #6FA3D1;
    --signal-info-tint:    rgba(111, 163, 209, 0.13);
    --signal-mute:         #8C8A84;
    --signal-mute-tint:    rgba(140, 138, 132, 0.12);

    /* Shadows mostly suppressed in dark mode — depth carried by surface tone + borders */
    --shadow-sm:  inset 0 1px 0 rgba(255, 250, 240, 0.04);
    --shadow-md:  0 6px 18px rgba(0, 0, 0, 0.45);
    --shadow-lg:  0 20px 50px rgba(0, 0, 0, 0.60);
  }

  /* Signature pad — paper aesthetic across ALL themes (it represents a physical receipt slip) */
  .sig-canvas { background: #F4F1EA !important; }

  /* Specific dark-mode overrides where elements need extra love */
  /* Primary buttons in dark mode use a deeper, more saturated blue so white text reads (WCAG AA).
     The lifted --accent is meant for inline accents/links, NOT for filled-button backgrounds. */
  [data-theme="dark"] .btn {
    background: #3D7BAE; color: #FFFFFF; border-color: transparent;
  }
  [data-theme="dark"] .btn:hover { background: #4D8DC2; }
  [data-theme="dark"] .btn:active { background: #2D6594; }
  /* Secondary button in dark — bump contrast a touch */
  [data-theme="dark"] .btn.secondary {
    background: var(--surface-2); color: var(--ink-primary); border-color: var(--line-strong);
  }
  [data-theme="dark"] .btn.secondary:hover { background: #2C3137; border-color: var(--ink-tertiary); }
  /* Ghost button: keep the lifted accent text on a translucent hover */
  [data-theme="dark"] .btn.ghost { color: var(--accent); }
  [data-theme="dark"] .btn.ghost:hover { background: var(--accent-tint); }
  /* Danger stays a coral/red outline-style button */
  [data-theme="dark"] .btn.danger {
    background: transparent; color: var(--signal-danger); border-color: var(--signal-danger);
  }
  [data-theme="dark"] .btn.danger:hover { background: rgba(232, 122, 110, 0.14); }
  [data-theme="dark"] .topbar .brand-mark { filter: drop-shadow(0 1px 2px rgba(232, 58, 92, 0.3)); }
  [data-theme="dark"] .login-card { background: var(--surface-2); }
  [data-theme="dark"] .panel.panel-parts .part { background: var(--surface-2); }
  [data-theme="dark"] .note.work_session { background: rgba(95, 191, 138, 0.08); border-left-color: var(--signal-success); }
  [data-theme="dark"] .section.alert { border-left-color: var(--signal-warn); background: rgba(232, 179, 85, 0.04); }
  [data-theme="dark"] .days-chip.days-old { color: var(--signal-warn); }
  [data-theme="dark"] .days-chip.days-very-old { color: var(--signal-danger); }
  [data-theme="dark"] .cursive-sig { color: var(--ink-primary); }
  [data-theme="dark"] .sig-saved-img { background: #fff; padding: 4px; border-radius: var(--radius-sm); }
  /* Tinted callouts that previously hard-coded light-theme greens/yellows — proper dark variants */
  [data-theme="dark"] .timer-panel {
    background: rgba(95, 191, 138, 0.08); border-color: rgba(95, 191, 138, 0.30);
  }
  [data-theme="dark"] .timer-panel.running {
    background: linear-gradient(180deg, rgba(95, 191, 138, 0.15), var(--surface-1)); border-color: var(--signal-success);
  }
  [data-theme="dark"] .timer-panel.busy {
    background: rgba(232, 179, 85, 0.10); border-color: rgba(232, 179, 85, 0.35);
  }
  [data-theme="dark"] .nudge {
    background: rgba(232, 179, 85, 0.12); color: var(--signal-warn); border: 1px solid rgba(232, 179, 85, 0.30);
  }
  [data-theme="dark"] .ac-item:hover, [data-theme="dark"] .ac-item.active { background: var(--surface-2); }
  [data-theme="dark"] .ac-item.custom { background: var(--surface-2); }
  [data-theme="dark"] .ac-item.custom:hover { background: var(--surface-3, #2C3137); }
  [data-theme="dark"] .ref-row { background: var(--surface-2); border-color: var(--line-soft); }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--surface-canvas);
    color: var(--ink-primary);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px; line-height: 1.5; font-weight: 400;
    font-feature-settings: "tnum" 1, "ss01" 1;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; cursor: pointer; font-family: inherit; }
  input, textarea, select { font: inherit; font-family: inherit; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .hidden { display: none !important; }
  /* Utility classes for common inline styles */
  .mt-2 { margin-top: var(--s-2) !important; }
  .mt-3 { margin-top: var(--s-3) !important; }
  .mt-4 { margin-top: var(--s-4) !important; }
  .mt-5 { margin-top: var(--s-5) !important; }
  .row-between { display: flex; justify-content: space-between; align-items: center; }
  .ta-center { text-align: center; }
  .mono { font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace; }

  /* ---------- Top bar ---------- */
  .topbar {
    background: var(--surface-1);
    color: var(--ink-primary);
    padding: 10px 20px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line-soft);
    height: 56px;
  }
  .topbar .brand { display: flex; align-items: center; gap: var(--s-3); }
  .topbar .brand-mark {
    width: 38px; height: auto; display: block; flex-shrink: 0;
    filter: drop-shadow(0 1px 1px rgba(207, 10, 44, 0.15));
  }
  .topbar .brand-text {
    font-family: "Inter", sans-serif; font-size: 16px; font-weight: 600;
    color: var(--ink-primary); letter-spacing: -0.01em;
  }
  .topbar .brand-text .sub { color: var(--ink-tertiary); font-weight: 400; }
  .topbar .who { font-size: 13px; color: var(--ink-secondary); display: flex; align-items: center; gap: var(--s-3); }
  .topbar .who button {
    background: transparent; color: var(--ink-secondary); border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm); padding: 6px 12px; font-size: 13px; transition: background-color 120ms ease, border-color 120ms ease;
  }
  .topbar .who button:hover { background: var(--surface-2); border-color: var(--ink-tertiary); }
  /* Theme toggle — segmented control */
  .theme-toggle {
    display: inline-flex; align-items: center; gap: 0;
    background: var(--surface-2); border: 1px solid var(--line-soft);
    border-radius: var(--radius-pill); padding: 2px;
  }
  .theme-toggle button {
    width: 32px; height: 28px; padding: 0; margin: 0;
    background: transparent; border: 0; border-radius: var(--radius-pill);
    display: grid; place-items: center; cursor: pointer; color: var(--ink-tertiary);
    transition: background-color 120ms ease, color 120ms ease;
  }
  .theme-toggle button:hover { color: var(--ink-secondary); }
  .theme-toggle button.active {
    background: var(--surface-1); color: var(--ink-primary);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
  }
  [data-theme="dark"] .theme-toggle button.active { box-shadow: inset 0 1px 0 rgba(255, 250, 240, 0.06); }
  .theme-toggle svg { width: 16px; height: 16px; }
  @media (max-width: 640px) {
    .theme-toggle button { width: 28px; height: 24px; }
    .theme-toggle svg { width: 14px; height: 14px; }
  }

  /* ---------- App container ---------- */
  .app { max-width: 1180px; margin: 0 auto; padding: 22px 18px 80px; }

  /* ---------- Login ---------- */
  .login-wrap { min-height: calc(100vh - 60px); display: grid; place-items: center; padding: 20px; }
  .login-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 28px; width: 100%; max-width: 380px; box-shadow: 0 6px 20px rgba(0,0,0,0.04);
  }
  .login-card h1 { margin: 0 0 4px; font-size: 22px; color: var(--navy); }
  .login-card .sub { color: var(--muted); margin-bottom: 22px; font-size: 14px; }
  .login-card label { display: block; font-size: 12px; font-weight: 600; color: var(--gray); margin: 14px 0 4px; text-transform: uppercase; letter-spacing: 0.04em; }
  .login-card input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
  }
  .login-card .btn { margin-top: 20px; width: 100%; }
  .login-card .demo-note {
    margin-top: 18px; padding: 10px 12px; background: var(--amber-bg); color: var(--amber);
    border-radius: 8px; font-size: 12px; line-height: 1.5;
  }

  /* ---------- Buttons ---------- */
  .btn {
    background: var(--accent); color: var(--ink-on-accent); border: 1px solid transparent;
    padding: 10px 16px; border-radius: var(--radius-md);
    font-weight: 500; font-size: 15px; line-height: 1.2;
    transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;
    display: inline-flex; align-items: center; gap: var(--s-2);
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:active { background: var(--accent-pressed); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.secondary {
    background: var(--surface-1); color: var(--ink-primary); border-color: var(--line-strong);
  }
  .btn.secondary:hover { background: var(--surface-2); border-color: var(--ink-tertiary); }
  .btn.ghost {
    background: transparent; color: var(--accent); border-color: transparent; padding: 8px 10px;
  }
  .btn.ghost:hover { background: var(--accent-tint); }
  .btn.small { padding: 6px 12px; font-size: 14px; border-radius: var(--radius-sm); }
  .btn.danger {
    background: var(--surface-1); color: var(--signal-danger); border-color: var(--signal-danger);
  }
  .btn.danger:hover { background: var(--signal-danger-tint); }
  /* Disabled state */
  .btn[disabled], .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ---------- Search bar ---------- */
  .search-row { display: flex; gap: var(--s-3); margin-bottom: var(--s-5); align-items: center; }
  .search-row input {
    flex: 1; padding: 14px 18px; border-radius: var(--radius-md); border: 1px solid var(--line-soft);
    font-size: 18px; background: var(--surface-1); color: var(--ink-primary);
    transition: border-color 120ms ease, box-shadow 120ms ease;
  }
  .search-row input::placeholder { color: var(--ink-tertiary); }
  .search-row input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-tint);
  }

  /* ---------- Section (dashboard list grouping) ---------- */
  .section {
    background: var(--surface-1); border: 1px solid var(--line-soft);
    border-radius: var(--radius-md); margin-bottom: var(--s-5);
    box-shadow: var(--shadow-sm);
  }
  .section h2 {
    margin: 0; padding: var(--s-4) var(--s-4);
    font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-secondary); border-bottom: 1px solid var(--line-soft);
    display: flex; align-items: center; justify-content: space-between;
  }
  .section h2 .count { color: var(--ink-tertiary); font-weight: 500; font-size: 12px; }
  /* Calm "needs attention" — small amber dot + amber left rule, no alarm wash */
  .section.alert { border-left: 3px solid var(--signal-warn); }
  .section.alert h2 { color: var(--ink-primary); background: transparent; border-bottom-color: var(--line-soft); }
  .section.alert h2::before {
    content: ''; width: 10px; height: 10px; border-radius: 50%;
    background: var(--signal-warn); margin-right: var(--s-2); display: inline-block;
  }
  .section-sub {
    padding: var(--s-2) var(--s-4); font-size: 12px; color: var(--ink-tertiary);
    border-bottom: 1px solid var(--line-soft); background: var(--surface-2);
  }
  /* Quiet divider between Needs Attention and the queue (no dashed alarm bar) */
  .section-divider { height: var(--s-4); }

  /* ---------- Repair rows ---------- */
  .row {
    display: grid; grid-template-columns: 64px 1fr 160px auto;
    gap: var(--s-4); padding: var(--s-3) var(--s-4);
    border-bottom: 1px solid var(--line-soft); align-items: center; cursor: pointer;
    min-height: 56px;
  }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: var(--surface-2); }
  .row .ticket {
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    font-weight: 600; color: var(--ink-primary); font-size: 14px;
  }
  .row .who { color: var(--ink-primary); font-weight: 500; font-size: 15px; line-height: 1.3; }
  .row .who small {
    display: block; color: var(--ink-tertiary); font-size: 13px; font-weight: 400;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px;
  }
  .row .meta { color: var(--ink-secondary); font-size: 13px; text-align: right; line-height: 1.4; }
  .row .badge-cell { text-align: right; display: flex; gap: var(--s-2); justify-content: flex-end; align-items: center; }

  /* ---------- Badges (status pills + flags) — muted, never neon ---------- */
  .badge {
    display: inline-flex; align-items: center; padding: 2px 10px; border-radius: var(--radius-pill);
    font-size: 12px; font-weight: 500; line-height: 1.6; letter-spacing: 0;
    background: var(--signal-mute-tint); color: var(--signal-mute);
  }
  .badge.intake  { background: var(--signal-mute-tint);    color: var(--signal-mute); }
  .badge.diag    { background: var(--signal-info-tint);    color: var(--signal-info); }
  .badge.parts   { background: var(--signal-warn-tint);    color: var(--signal-warn); }
  .badge.cust    { background: var(--signal-warn-tint);    color: var(--signal-warn); }
  .badge.repair  { background: var(--signal-info-tint);    color: var(--signal-info); }
  .badge.ready   { background: var(--signal-success-tint); color: var(--signal-success); }
  .badge.picked  { background: var(--signal-mute-tint);    color: var(--signal-mute); }
  .badge.aband   { background: var(--signal-danger-tint);  color: var(--signal-danger); }
  .badge.alert   { background: var(--signal-warn-tint);    color: var(--signal-warn); }

  /* ---------- Detail ---------- */
  .back-link { display: inline-block; margin-bottom: 14px; color: var(--muted); font-size: 14px; }
  .detail-header {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 20px; margin-bottom: 18px;
  }
  .detail-header .top { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; }
  .detail-header h2 { margin: 0; color: var(--navy); font-size: 22px; }
  .detail-header .phone {
    background: var(--blue-bg); color: var(--blue); padding: 4px 10px; border-radius: 6px;
    font-weight: 600; font-size: 14px;
  }
  .detail-header .meta { display: flex; gap: 20px; margin-top: 8px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
  .detail-header .meta strong { color: var(--text); font-weight: 600; }
  .detail-header select { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); font-weight: 600; }
  .detail-header .alerts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 820px) { .detail-grid { grid-template-columns: 1fr; } }
  .panel {
    background: var(--surface-1); border: 1px solid var(--line-soft); border-radius: var(--radius-md);
    padding: var(--s-5); box-shadow: var(--shadow-sm);
  }
  .panel h3 {
    margin: 0 0 var(--s-3); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-secondary); font-weight: 600;
    display: flex; justify-content: space-between; align-items: center; gap: var(--s-3);
  }
  .panel h3 .actions { display: flex; gap: var(--s-2); flex-wrap: wrap; }
  /* All panels are white now — meaning is in the tiny icon next to the title, not a wash of color.
     Legacy color classes resolve to no-op so existing markup keeps rendering. */
  .panel.panel-issue, .panel.panel-parts, .panel.panel-manuals, .panel.panel-notes, .panel.panel-labor {
    background: var(--surface-1); border-color: var(--line-soft); box-shadow: var(--shadow-sm);
  }
  /* Subtle category cue: small colored dot in front of the panel title */
  .panel.panel-issue   h3::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--signal-info);    display: inline-block; margin-right: var(--s-2); }
  .panel.panel-parts   h3::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--signal-warn);    display: inline-block; margin-right: var(--s-2); }
  .panel.panel-manuals h3::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--signal-info);    display: inline-block; margin-right: var(--s-2); }
  .panel.panel-notes   h3::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--signal-mute);    display: inline-block; margin-right: var(--s-2); }
  .panel.panel-labor   h3::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--signal-success); display: inline-block; margin-right: var(--s-2); }
  .panel.panel-parts .part { background: var(--surface-2); }

  .kv { margin: 6px 0; }
  .kv .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
  .kv .v { color: var(--text); }
  .checkrow { display: flex; gap: 14px; flex-wrap: wrap; margin: 6px 0; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text); }
  .check .y { color: var(--green); font-weight: 700; }
  .check .n { color: var(--muted); }

  /* ---------- Parts ---------- */
  .part {
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
    display: grid; gap: 4px;
  }
  .part .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .part .name { font-weight: 600; }
  .part .sub { font-size: 12px; color: var(--muted); }
  .part .actions { margin-top: 6px; display: flex; gap: 6px; }

  /* ---------- Notes ---------- */
  .note {
    border-left: 2px solid var(--line-strong);
    padding: var(--s-2) 0 var(--s-3) var(--s-3); margin-bottom: var(--s-2);
  }
  /* All call-log entry types share a quiet gray rule — type is read from the small uppercase label */
  .note.inbound_call,
  .note.outbound_call,
  .note.voicemail_left,
  .note.text_sent,
  .note.internal { border-color: var(--line-strong); }
  /* Work sessions are genuinely different — they're billable time. Sage left rule earns the visual weight. */
  .note.work_session {
    border-left: 3px solid var(--signal-success); background: var(--signal-success-tint);
    padding: var(--s-3) var(--s-3); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    margin-bottom: var(--s-2);
  }
  .note.work_session .session-head {
    display: flex; align-items: center; gap: var(--s-2); margin-bottom: var(--s-1); flex-wrap: wrap;
  }
  .note.work_session .session-head .who { font-weight: 600; color: var(--ink-primary); font-size: 14px; }
  .note.work_session .session-head .duration {
    background: var(--surface-1); color: var(--signal-success); padding: 2px 10px; border-radius: var(--radius-pill);
    font-weight: 600; font-size: 12px; font-variant-numeric: tabular-nums; border: 1px solid var(--signal-success);
  }
  .note.work_session .session-head .when { color: var(--ink-tertiary); font-size: 13px; }
  .note.work_session .session-body { color: var(--ink-primary); margin-top: 2px; font-size: 14px; }
  .note .meta { font-size: 12px; color: var(--ink-tertiary); margin-bottom: 4px; }
  .note .meta .type {
    display: inline-block; background: transparent; color: var(--ink-tertiary);
    padding: 0; font-size: 11px; font-weight: 600;
    margin-right: var(--s-2); text-transform: uppercase; letter-spacing: 0.06em;
  }
  /* Color is conveyed by the small dot prefix, not the whole pill — keeps the column scanable */
  .note .meta .type::before {
    content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--signal-mute); margin-right: var(--s-2); vertical-align: middle;
  }
  .note.inbound_call  .meta .type::before { background: var(--signal-info); }
  .note.outbound_call .meta .type::before { background: var(--signal-warn); }
  .note.voicemail_left .meta .type::before { background: var(--signal-info); }
  .note.text_sent      .meta .type::before { background: var(--signal-info); }
  .note.internal       .meta .type::before { background: var(--signal-mute); }
  .note > div:not(.meta):not(.session-head):not(.session-body) {
    color: var(--ink-primary); font-size: 14px; line-height: 1.5;
  }

  /* ---------- Form (intake) ---------- */
  .form-card {
    background: var(--surface-1); border: 1px solid var(--line-soft);
    border-radius: var(--radius-md); padding: var(--s-5); box-shadow: var(--shadow-sm);
  }
  .form-card h2 { margin: 0 0 4px; color: var(--ink-primary); font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
  .form-card .sub { color: var(--ink-tertiary); margin-bottom: var(--s-5); font-size: 14px; }
  .form-section { margin-bottom: var(--s-5); padding-bottom: var(--s-5); border-bottom: 1px solid var(--line-soft); }
  .form-section:last-of-type { border-bottom: 0; }
  .form-section h3 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-secondary); margin: 0 0 var(--s-3); font-weight: 600;
  }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); }
  @media (max-width: 640px) { .form-row { grid-template-columns: 1fr; } }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-secondary); margin-bottom: var(--s-1); text-transform: uppercase; letter-spacing: 0.04em; }
  .field input, .field textarea, .field select {
    width: 100%; padding: 11px 12px; border: 1px solid var(--line-soft); border-radius: var(--radius-sm);
    font-size: 15px; color: var(--ink-primary); background: var(--surface-1);
    transition: border-color 120ms ease, box-shadow 120ms ease;
  }
  .field input:focus, .field textarea:focus, .field select:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint);
  }
  .field textarea { min-height: 80px; resize: vertical; }
  .checkbox-row { display: flex; gap: var(--s-4); flex-wrap: wrap; align-items: center; padding: var(--s-2) 0; }
  .checkbox-row label { font-weight: 500; color: var(--ink-primary); display: flex; align-items: center; gap: var(--s-2); cursor: pointer; }
  .radio-block { display: flex; flex-direction: column; gap: var(--s-2); }
  .radio-block label {
    display: flex; align-items: center; gap: var(--s-2); font-weight: 500; cursor: pointer;
    padding: var(--s-3) var(--s-4); border: 1px solid var(--line-soft); border-radius: var(--radius-sm);
    transition: border-color 120ms ease, background-color 120ms ease;
  }
  .radio-block label:hover { border-color: var(--ink-tertiary); background: var(--surface-2); }
  .radio-block label.active { border-color: var(--accent); background: var(--accent-tint); }
  .policy-box {
    background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: var(--radius-sm);
    padding: var(--s-4); font-size: 14px; line-height: 1.5; max-height: 200px; overflow-y: auto;
    color: var(--ink-primary);
  }
  .form-actions { display: flex; gap: var(--s-3); justify-content: flex-end; margin-top: var(--s-3); }

  /* ---------- Modal ---------- */
  .modal-wrap {
    position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center;
    padding: var(--s-4); z-index: 100;
    animation: modal-fade 120ms ease-out;
  }
  @keyframes modal-fade { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--surface-1); border-radius: var(--radius-lg); padding: var(--s-5);
    max-width: 520px; width: 100%; box-shadow: var(--shadow-lg);
    animation: modal-slide 160ms ease-out;
  }
  @keyframes modal-slide { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal h3 { margin: 0 0 var(--s-1); color: var(--ink-primary); font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  .modal .sub { color: var(--ink-secondary); margin-bottom: var(--s-4); font-size: 13px; line-height: 1.5; }

  /* ---------- Empty ---------- */
  .empty { padding: 24px; text-align: center; color: var(--muted); font-size: 14px; }

  /* ---------- Tip strip (now muted, not yellow alarm) ---------- */
  .tip-strip {
    background: var(--surface-2); border: 1px solid var(--line-soft); color: var(--ink-secondary);
    padding: var(--s-2) var(--s-4); border-radius: var(--radius-sm); font-size: 13px;
    margin-bottom: var(--s-4); line-height: 1.5;
  }
  .tip-strip strong { color: var(--ink-primary); font-weight: 600; }
  /* ---------- Theme-aware callouts (replaces inline-styled tinted blocks) ---------- */
  .callout-success {
    background: var(--signal-success-tint); border: 1px solid var(--signal-success);
    border-radius: var(--radius-sm); padding: var(--s-3) var(--s-4); color: var(--ink-primary);
  }
  .callout-info {
    background: var(--signal-info-tint); border: 1px solid var(--signal-info);
    border-radius: var(--radius-sm); padding: var(--s-3) var(--s-4); color: var(--ink-primary);
  }
  .callout-warn {
    background: var(--signal-warn-tint); border: 1px solid var(--signal-warn);
    border-radius: var(--radius-sm); padding: var(--s-3) var(--s-4); color: var(--ink-primary);
  }
  .preview-box {
    background: var(--surface-2); border: 1px solid var(--line-soft);
    border-radius: var(--radius-sm); padding: var(--s-3); color: var(--ink-primary);
  }
  /* In dark mode the borders soften so callouts don't read as outlined boxes */
  [data-theme="dark"] .callout-success { border-color: rgba(95, 191, 138, 0.30); }
  [data-theme="dark"] .callout-info    { border-color: rgba(111, 163, 209, 0.30); }
  [data-theme="dark"] .callout-warn    { border-color: rgba(232, 179, 85, 0.30); }

  /* Reduce motion for users who prefer it */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  /* ---------- Mobile-responsive (≤ 768px) ---------- */
  @media (max-width: 768px) {
    .app { padding: var(--s-3) var(--s-3) var(--s-7); }
    .topbar { padding: var(--s-2) var(--s-3); height: auto; min-height: 56px; }
    .topbar .brand-text { font-size: 15px; }
    .topbar .who { font-size: 12px; gap: var(--s-2); }
    .topbar .who #who-name { display: none; }   /* free up room — name shown in user menu later */
    .search-row { flex-direction: column; align-items: stretch; gap: var(--s-2); }
    .search-row input { font-size: 16px; padding: var(--s-3) var(--s-4); }  /* iOS won't auto-zoom at ≥16px */
    .search-row .btn { width: 100%; justify-content: center; }
    /* Dashboard rows reflow to a 2-line stack on small screens */
    .row {
      grid-template-columns: 56px 1fr; grid-template-rows: auto auto;
      grid-template-areas: 'ticket who' 'meta badge'; padding: var(--s-3); gap: var(--s-2) var(--s-3);
      min-height: auto;
    }
    .row .ticket { grid-area: ticket; }
    .row .who    { grid-area: who; }
    .row .meta   { grid-area: meta; text-align: left; padding-left: 56px; font-size: 12px; }
    .row .badge-cell { grid-area: badge; justify-content: flex-end; }
    .row .who small { white-space: normal; }
    /* Detail header collapses */
    .detail-header .top { gap: var(--s-2); }
    .detail-header h2 { font-size: 18px; }
    .detail-header .meta { gap: var(--s-2); font-size: 12px; }
    /* Detail grid already collapses at 820px — already handled */
    .panel { padding: var(--s-4); }
    .form-card { padding: var(--s-4); }
    /* Modal full-width with padding */
    .modal { padding: var(--s-4); border-radius: var(--radius-md); max-width: 100%; }
    .modal h3 { font-size: 18px; }
    /* Buttons get bigger tap targets */
    .btn { padding: 12px 16px; min-height: 44px; }
    .btn.small { padding: 8px 14px; min-height: 36px; }
    /* Manual quick-search wraps */
    .quick-search a { padding: 8px 12px; font-size: 14px; }
    /* Section header more compact */
    .section h2 { padding: var(--s-3) var(--s-3); }
    /* Sticky search at top of scroll on mobile */
    .search-row { position: sticky; top: 0; z-index: 30; padding: var(--s-2) 0;
                  background: var(--surface-canvas); margin-left: calc(-1 * var(--s-3));
                  margin-right: calc(-1 * var(--s-3)); padding-left: var(--s-3); padding-right: var(--s-3);
                  border-bottom: 1px solid var(--line-soft); }
  }
  /* Tighter still on very small screens */
  @media (max-width: 380px) {
    .row .meta { padding-left: 0; }
    .row .ticket { font-size: 13px; }
    .row .who { font-size: 14px; }
    .badge { font-size: 11px; padding: 2px 8px; }
  }

  /* ---------- Cursive signature ---------- */
  .cursive-sig {
    font-family: "Caveat", "Brush Script MT", cursive;
    font-size: 36px; line-height: 1; color: var(--ink-primary);
    letter-spacing: 0.01em; padding: var(--s-2) var(--s-3);
  }
  .sig-preview {
    background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: var(--radius-sm);
    margin-top: var(--s-2); padding: var(--s-3) var(--s-4); min-height: 56px;
    display: flex; align-items: center; justify-content: space-between; gap: var(--s-3);
  }
  .sig-preview .sig-preview-name { font-family: "Caveat", cursive; font-size: 32px; line-height: 1; color: var(--ink-primary); }
  .sig-preview .sig-preview-hint { font-size: 11px; color: var(--ink-tertiary); text-transform: uppercase; letter-spacing: 0.06em; }
  .sig-preview.empty .sig-preview-name { color: var(--ink-tertiary); font-style: italic; }

  /* ---------- Signature pad ---------- */
  .sig-wrap { margin-top: 8px; }
  .sig-canvas {
    background: #fff; border: 2px dashed var(--line); border-radius: 8px;
    width: 100%; height: 150px; touch-action: none; cursor: crosshair;
    display: block;
  }
  .sig-canvas.signed { border-style: solid; border-color: var(--green); }
  .sig-actions { display: flex; gap: 8px; margin-top: 6px; align-items: center; flex-wrap: wrap; }
  .sig-actions .hint { color: var(--muted); font-size: 13px; }
  .sig-saved-img {
    background: #fff; border: 1px solid var(--line); border-radius: 8px;
    max-width: 280px; max-height: 100px; padding: 4px;
  }

  /* ---------- Autocomplete ---------- */
  .ac-wrap { position: relative; }
  .ac-dropdown {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 60;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.10); max-height: 320px; overflow-y: auto;
    margin-top: 4px;
  }
  .ac-item {
    padding: 8px 12px; cursor: pointer; border-bottom: 1px solid #f3f4f6;
    display: flex; flex-direction: column; gap: 2px;
  }
  .ac-item:last-child { border-bottom: 0; }
  .ac-item:hover, .ac-item.active { background: #f8fafc; }
  .ac-item .label { font-weight: 600; color: var(--text); font-size: 14px; }
  .ac-item .sub   { color: var(--muted); font-size: 12px; }
  .ac-item.custom { color: var(--blue); font-weight: 600; padding: 10px 12px; border-top: 1px solid var(--line); background: #f9fafb; }
  .ac-item.custom:hover { background: #eef2ff; }

  /* ---------- Reference manuals ---------- */
  .ref-row {
    display: flex; gap: 8px; align-items: center; padding: 8px 10px;
    background: #f8fafc; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px;
  }
  .ref-row .ico { font-size: 16px; }
  .ref-row .lbl { flex: 1; }
  .ref-row .lbl a { color: var(--blue); font-weight: 600; }
  .ref-row .lbl small { display: block; color: var(--muted); font-size: 12px; word-break: break-all; }
  .ref-row .del { background: transparent; border: 0; color: #b91c1c; cursor: pointer; padding: 4px 8px; border-radius: 4px; font-size: 16px; }
  .ref-row .del:hover { background: #fee2e2; }
  .quick-search { display: flex; gap: var(--s-2); flex-wrap: wrap; margin: var(--s-2) 0 var(--s-3); }
  .quick-search a {
    background: var(--surface-1); border: 1px solid var(--line-soft); border-radius: var(--radius-sm);
    padding: 6px 12px; font-size: 13px; color: var(--ink-primary);
    display: inline-flex; align-items: center; gap: var(--s-2);
    text-decoration: none;
    transition: background-color 120ms ease, border-color 120ms ease;
  }
  .quick-search a:hover { background: var(--surface-2); border-color: var(--ink-tertiary); text-decoration: none; }
  [data-theme="dark"] .quick-search a { background: var(--surface-2); border-color: var(--line-strong); }
  [data-theme="dark"] .quick-search a:hover { background: var(--surface-1); border-color: var(--accent); }

  /* ---------- Work timer ---------- */
  .timer-panel {
    border: 1px solid #a7f3d0; border-radius: 12px; padding: 16px 20px;
    background: #f0fdf4; /* light green idle — matches the green theme of the timer */
    margin-top: 14px;
  }
  .timer-panel.running { background: linear-gradient(180deg, #ecfdf5, #ffffff); border-color: #6ee7b7; }
  .timer-panel.busy   { background: #fffbe6; border-color: #fde68a; }
  .timer-panel h3 {
    margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gray);
    display: flex; justify-content: space-between; align-items: center;
  }
  .timer-clock {
    font-variant-numeric: tabular-nums; font-feature-settings: "tnum";
    font-size: 36px; font-weight: 700; color: var(--green);
    letter-spacing: 0.02em; margin: 6px 0 4px;
  }
  .timer-clock.warn { color: var(--amber); }
  .timer-meta { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .timer-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn.start { background: var(--green); }
  .btn.stop  { background: #b91c1c; }
  .timer-busy-row {
    display: flex; align-items: center; gap: 8px; color: var(--amber); font-weight: 600;
  }
  .badge.timer { background: var(--signal-success-tint); color: var(--signal-success); }

  /* Days-in-shop — text-only, no chip; gets warmer with age (green chip suppressed entirely) */
  .days-chip {
    display: inline-block; font-size: 12px; font-weight: 500; margin-top: 2px;
    color: var(--ink-tertiary);
  }
  .days-chip.days-fresh    { display: none; }                       /* under 4 days = no signal */
  .days-chip.days-aging    { color: var(--ink-tertiary); }          /* 4–7 days = quiet */
  .days-chip.days-old      { color: var(--signal-warn); font-weight: 600; }
  .days-chip.days-very-old { color: var(--signal-danger); font-weight: 600; }
  .nudge {
    margin-top: 10px; padding: 8px 12px; background: #fef3c7; color: #78350f;
    border-radius: 8px; font-size: 13px;
  }
</style>
</head>

/* ============================================================
   Inline Supabase-compatible client — no eval, no external deps.
   Replaces @supabase/supabase-js@2 because that SDK uses Function()
   constructors which strict-CSP browser extensions block.
   API surface: enough to be a drop-in replacement for the calls
   the HobbyTown app makes.
   ============================================================ */
(function () {
  const SESSION_KEY = 'mini.sb.session';

  function MiniSb(url, anonKey) {
    this.url = url.replace(/\/$/, '');
    this.anonKey = anonKey;
    this._listeners = [];
    try { this.session = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch (_) { this.session = null; }
    this._installAuth();
    this._installFunctions();
    this._installStorage();
  }

  MiniSb.prototype._fire = function (event) {
    for (const cb of this._listeners) { try { cb(event, { session: this.session }); } catch (e) { console.error('auth listener:', e); } }
  };

  MiniSb.prototype._authHeaders = function () {
    const h = { 'apikey': this.anonKey, 'Content-Type': 'application/json' };
    if (this.session && this.session.access_token) h['Authorization'] = 'Bearer ' + this.session.access_token;
    else h['Authorization'] = 'Bearer ' + this.anonKey;
    return h;
  };

  // Refresh the access token if it's near expiry. Returns true if refreshed.
  MiniSb.prototype._refreshIfNeeded = async function () {
    if (!this.session) return false;
    const exp = this.session.expires_at || 0;
    const now = Math.floor(Date.now() / 1000);
    if (now < exp - 60) return false; // not yet near expiry
    if (!this.session.refresh_token) return false;
    if (this._refreshInFlight) { await this._refreshInFlight; return true; }
    const self = this;
    this._refreshInFlight = (async () => {
      const r = await fetch(self.url + '/auth/v1/token?grant_type=refresh_token', {
        method: 'POST',
        headers: { 'apikey': self.anonKey, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: self.session.refresh_token }),
      });
      if (!r.ok) {
        self.session = null;
        try { localStorage.removeItem('mini.sb.session'); } catch (_) {}
        self._fire('SIGNED_OUT');
        throw new Error('Token refresh failed');
      }
      const data = await r.json();
      self.session = data;
      try { localStorage.setItem('mini.sb.session', JSON.stringify(data)); } catch (_) {}
      self._fire('TOKEN_REFRESHED');
    })();
    try { await this._refreshInFlight; return true; }
    finally { this._refreshInFlight = null; }
  };

  // fetch wrapper: tries the request, on 401 tries refresh + retry once.
  MiniSb.prototype._authedFetch = async function (input, init) {
    await this._refreshIfNeeded();
    init = init || {};
    init.headers = init.headers || this._authHeaders();
    let r = await fetch(input, init);
    if (r.status === 401 && this.session && this.session.refresh_token) {
      try {
        await this._refreshIfNeeded();
        init.headers = this._authHeaders();
        r = await fetch(input, init);
      } catch (_) {}
    }
    return r;
  };

  MiniSb.prototype._installAuth = function () {
    const self = this;
    this.auth = {
      async signInWithPassword({ email, password }) {
        const r = await fetch(self.url + '/auth/v1/token?grant_type=password', {
          method: 'POST',
          headers: { 'apikey': self.anonKey, 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await r.json();
        if (!r.ok) return { data: null, error: { message: data.error_description || data.msg || data.error || 'Sign-in failed' } };
        self.session = data;
        try { localStorage.setItem(SESSION_KEY, JSON.stringify(data)); } catch (_) {}
        self._fire('SIGNED_IN');
        return { data: { user: data.user, session: data }, error: null };
      },
      async getSession() {
        return { data: { session: self.session }, error: null };
      },
      async getUser() {
        if (!self.session || !self.session.access_token) return { data: { user: null }, error: null };
        const r = await self._authedFetch(self.url + '/auth/v1/user');
        if (!r.ok) {
          if (r.status === 401) {
            self.session = null;
            try { localStorage.removeItem(SESSION_KEY); } catch (_) {}
          }
          return { data: { user: null }, error: { message: 'Unauthorized' } };
        }
        const user = await r.json();
        return { data: { user }, error: null };
      },
      async signOut() {
        const t = self.session && self.session.access_token;
        self.session = null;
        try { localStorage.removeItem(SESSION_KEY); } catch (_) {}
        if (t) {
          try { await fetch(self.url + '/auth/v1/logout', { method: 'POST', headers: { 'apikey': self.anonKey, 'Authorization': 'Bearer ' + t } }); } catch (_) {}
        }
        self._fire('SIGNED_OUT');
        return { error: null };
      },
      async updateUser(updates) {
        const r = await fetch(self.url + '/auth/v1/user', {
          method: 'PUT',
          headers: self._authHeaders(),
          body: JSON.stringify(updates),
        });
        const data = await r.json();
        if (!r.ok) return { data: null, error: { message: data.error_description || data.msg || data.error || 'Update failed' } };
        return { data, error: null };
      },
      onAuthStateChange(cb) {
        self._listeners.push(cb);
        return { data: { subscription: { unsubscribe: () => { self._listeners = self._listeners.filter(x => x !== cb); } } } };
      },
    };
  };

  MiniSb.prototype._installFunctions = function () {
    const self = this;
    this.functions = {
      async invoke(name, opts) {
        const body = (opts && opts.body) || {};
        const r = await self._authedFetch(self.url + '/functions/v1/' + name, {
          method: 'POST',
          headers: self._authHeaders(),
          body: JSON.stringify(body),
        });
        const txt = await r.text();
        let data; try { data = txt ? JSON.parse(txt) : null; } catch (_) { data = txt; }
        if (!r.ok) return { data: null, error: { message: typeof data === 'string' ? data : (data && data.message) || 'Function failed' } };
        return { data, error: null };
      }
    };
  };

  MiniSb.prototype._installStorage = function () {
    const self = this;
    this.storage = {
      from: (bucket) => ({
        getPublicUrl: (path) => ({ data: { publicUrl: self.url + '/storage/v1/object/public/' + bucket + '/' + path } }),
      }),
    };
  };

  MiniSb.prototype.rpc = async function (fn, args) {
    const r = await this._authedFetch(this.url + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: this._authHeaders(),
      body: JSON.stringify(args || {}),
    });
    const txt = await r.text();
    let data; try { data = txt ? JSON.parse(txt) : null; } catch (_) { data = null; }
    if (!r.ok) return { data: null, error: { message: typeof data === 'string' ? data : (data && data.message) || 'RPC failed' } };
    return { data, error: null };
  };

  // Realtime is replaced with a no-op chainable; polling is done in app code instead.
  MiniSb.prototype.channel = function () {
    const noop = { on: function () { return this; }, subscribe: function () { return this; } };
    return noop;
  };

  MiniSb.prototype.from = function (table) {
    return new QB(this, table);
  };

  function QB(client, table) {
    this.client = client;
    this.table = table;
    this.filters = [];
    this.selectCols = null;
    this._single = false;
    this._maybeSingle = false;
    this._order = null;
    this._action = null;
    this._body = null;
    this._onConflict = null;
  }

  QB.prototype.select = function (cols) { this.selectCols = cols || '*'; if (!this._action) this._action = 'select'; return this; };
  QB.prototype.eq = function (col, val) { this.filters.push([col, 'eq', val]); return this; };
  QB.prototype.neq = function (col, val) { this.filters.push([col, 'neq', val]); return this; };
  QB.prototype.lte = function (col, val) { this.filters.push([col, 'lte', val]); return this; };
  QB.prototype.gte = function (col, val) { this.filters.push([col, 'gte', val]); return this; };
  QB.prototype.is = function (col, val) { this.filters.push([col, 'is', val]); return this; };
  QB.prototype.in = function (col, vals) { this.filters.push([col, 'in', vals]); return this; };
  QB.prototype.order = function (col, opts) { this._order = col + '.' + ((opts && opts.ascending === false) ? 'desc' : 'asc'); return this; };
  QB.prototype.single = function () { this._single = true; return this; };
  QB.prototype.maybeSingle = function () { this._maybeSingle = true; return this; };

  QB.prototype.upsert = function (rows, opts) {
    this._action = 'upsert';
    this._body = Array.isArray(rows) ? rows : [rows];
    this._onConflict = (opts && opts.onConflict) || null;
    return this._exec();
  };
  QB.prototype.insert = function (rows) {
    this._action = 'insert';
    this._body = Array.isArray(rows) ? rows : [rows];
    return this._exec();
  };
  QB.prototype.update = function (values) {
    this._action = 'update';
    this._body = values;
    return this;
  };
  QB.prototype.delete = function () { this._action = 'delete'; return this; };

  QB.prototype._qs = function () {
    const ps = [];
    for (const [col, op, val] of this.filters) {
      if (op === 'in') {
        const vals = val.map(v => '"' + String(v).replace(/"/g, '\\"') + '"').join(',');
        ps.push(col + '=in.(' + vals + ')');
      } else if (op === 'is') {
        ps.push(col + '=is.' + (val === null ? 'null' : encodeURIComponent(val)));
      } else {
        ps.push(col + '=' + op + '.' + encodeURIComponent(val));
      }
    }
    if (this._order) ps.push('order=' + this._order);
    if (this._action === 'select') ps.push('select=' + encodeURIComponent(this.selectCols || '*'));
    if (this._action === 'upsert' && this._onConflict) ps.push('on_conflict=' + encodeURIComponent(this._onConflict));
    return ps.length ? '?' + ps.join('&') : '';
  };

  QB.prototype._exec = async function () {
    if (!this._action) this._action = 'select';
    const url = this.client.url + '/rest/v1/' + this.table + this._qs();
    const headers = Object.assign({}, this.client._authHeaders());
    let method = 'GET';
    let body;
    if (this._action === 'select') {
      method = 'GET';
    } else if (this._action === 'upsert') {
      method = 'POST';
      headers['Prefer'] = 'resolution=merge-duplicates,return=minimal';
      body = JSON.stringify(this._body);
    } else if (this._action === 'insert') {
      method = 'POST';
      headers['Prefer'] = 'return=minimal';
      body = JSON.stringify(this._body);
    } else if (this._action === 'update') {
      method = 'PATCH';
      headers['Prefer'] = 'return=minimal';
      body = JSON.stringify(this._body);
    } else if (this._action === 'delete') {
      method = 'DELETE';
    }
    const r = await this.client._authedFetch(url, { method, headers, body });
    if (!r.ok) {
      let errText; try { errText = await r.text(); } catch (_) { errText = 'HTTP ' + r.status; }
      let errBody; try { errBody = JSON.parse(errText); } catch (_) { errBody = { message: errText }; }
      return { data: null, error: errBody };
    }
    let data = null;
    const txt = await r.text();
    if (txt) { try { data = JSON.parse(txt); } catch (_) { data = txt; } }
    if ((this._single || this._maybeSingle) && Array.isArray(data)) {
      data = data.length ? data[0] : null;
    }
    return { data, error: null };
  };

  // Allow `await` on the builder for select-style queries
  QB.prototype.then = function (resolve, reject) {
    if (!this._action) this._action = 'select';
    return this._exec().then(resolve, reject);
  };
  QB.prototype.catch = function (reject) {
    return this.then(undefined, reject);
  };

  // Expose globally so existing `window.supabase.createClient(...)` calls work
  window.supabase = {
    createClient: function (url, key) { return new MiniSb(url, key); }
  };
})();

function diffDays(iso) {
  const d = new Date(iso + 'T00:00:00');
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.floor((t - d) / 86400000);
}

// In-memory cache hydrated from Supabase at boot.
// Synchronous read so the existing render code (which expects a sync loadDB()) doesn't have to change.
let _dbCache = { customers:[], repairs:[], parts:[], labor:[], notes:[], active_timers:[], custom_catalog:[], nextTicket: 1000 };
function loadDB() { return _dbCache; }
function saveDB(db) {
  _dbCache = db;
  if (!SUPABASE_ENABLED || !sb) {
    // Standalone fallback — write to localStorage. Should not happen in prod.
    try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (_) {}
    return;
  }
  // Fire-and-forget async sync to Supabase. UI keeps moving.
  pushDBToSupabase(db).catch(err => {
    console.error('Sync to Supabase failed:', err);
    showToast('⚠ ' + (err.message || String(err)) + ' — refresh and try again', 'error');
  });
}

// Track which IDs we last saw from the server, so we can detect client-side deletions on save.
let _lastServerIds = { active_timers: new Set(), parts: new Set(), notes: new Set(), labor: new Set() };

async function pullDBFromSupabase() {
  const [c, r, p, l, n, t] = await Promise.all([
    sb.from('customers').select('*'),
    sb.from('repairs').select('*'),
    sb.from('parts').select('*'),
    sb.from('labor_entries').select('*'),
    sb.from('notes').select('*'),
    sb.from('active_timers').select('*'),
  ]);
  if (c.error || r.error || p.error || l.error || n.error || t.error) {
    console.error('Pull errors:', c.error, r.error, p.error, l.error, n.error, t.error);
    throw new Error('Failed to load data from Supabase');
  }
  const repairs = r.data || [];
  const maxTicket = repairs.reduce((m, x) => Math.max(m, Number(x.ticket) || 0), 999);
  _dbCache = {
    customers: c.data || [],
    repairs,
    parts:     p.data || [],
    labor:     l.data || [],
    notes:     n.data || [],
    active_timers: t.data || [],
    custom_catalog: [],
    nextTicket: maxTicket + 1,
  };
  _lastServerIds.active_timers = new Set((t.data || []).map(x => x.id));
  _lastServerIds.parts         = new Set((p.data || []).map(x => x.id));
  _lastServerIds.notes         = new Set((n.data || []).map(x => x.id));
  _lastServerIds.labor         = new Set((l.data || []).map(x => x.id));
}

// PostgREST requires every row in a bulk upsert array to have IDENTICAL keys.
// Existing rows pulled from the server have all columns; freshly-created rows
// only have the fields the app explicitly set. Normalize to the union of all
// keys. For known NOT-NULL columns we substitute a sensible default instead of null.
const _NOT_NULL_DEFAULTS = {
  // repairs
  reference_links: [],
  transmitter_included: false,
  battery_included: false,
  charger_included: false,
  customer_supplied_parts: false,
  special_order_required: false,
  service_fee: 30,
  labor_rate: 60,
  status: 'intake',
  item_type: 'rc_vehicle',
};
function _normalizeBatch(rows) {
  if (!rows || !rows.length) return rows;
  const allKeys = new Set();
  for (const r of rows) for (const k of Object.keys(r)) allKeys.add(k);
  return rows.map(r => {
    const out = {};
    for (const k of allKeys) {
      const v = r[k];
      if (v === undefined || v === null) {
        out[k] = Object.prototype.hasOwnProperty.call(_NOT_NULL_DEFAULTS, k) ? _NOT_NULL_DEFAULTS[k] : null;
      } else {
        out[k] = v;
      }
    }
    return out;
  });
}

// Strip client-only fields and map JS table names → DB table names where they differ.
function _scrubRow(table, row) {
  const r = { ...row };
  if (table === 'repairs') {
    // ticket is assigned by the DB sequence (repair_ticket_seq). Strip any client-guessed value
    // so two simultaneous intakes can never collide. The post-save pullDBFromSupabase() refreshes
    // the cache with the server-assigned ticket number.
    delete r.ticket;
  }
  // Drop server-managed timestamps so PostgREST uses DB defaults on INSERT
  // and leaves them alone on UPDATE
  delete r.updated_at;
  delete r.created_at;
  return r;
}

async function pushDBToSupabase(db) {
  // Step 1: customers FIRST (FK target for repairs)
  if (db.customers.length) {
    const { error } = await sb.from('customers').upsert(_normalizeBatch(db.customers.map(x => _scrubRow('customers', x))), { onConflict: 'id' });
    if (error) { console.error('customers upsert:', error); throw new Error('Save failed (customers): ' + (error.message || JSON.stringify(error))); }
  }
  // Step 2: repairs (depends on customers, must come before parts/notes/labor/timers)
  if (db.repairs.length) {
    const { error } = await sb.from('repairs').upsert(_normalizeBatch(db.repairs.map(x => _scrubRow('repairs', x))), { onConflict: 'id' });
    if (error) { console.error('repairs upsert:', error); throw new Error('Save failed (repairs): ' + (error.message || JSON.stringify(error))); }
  }
  // Step 3: parts/labor/notes/timers can run in parallel (all depend on repairs)
  const ops = [];
  if (db.parts.length) ops.push(sb.from('parts').upsert(_normalizeBatch(db.parts.map(x => _scrubRow('parts', x))), { onConflict: 'id' }));
  if (db.labor.length) ops.push(sb.from('labor_entries').upsert(_normalizeBatch(db.labor.map(x => _scrubRow('labor_entries', x))), { onConflict: 'id' }));
  if (db.notes.length) ops.push(sb.from('notes').upsert(_normalizeBatch(db.notes.map(x => _scrubRow('notes', x))), { onConflict: 'id' }));
  const currentTimerIds = new Set(db.active_timers.map(x => x.id));
  const removedTimers = [..._lastServerIds.active_timers].filter(id => !currentTimerIds.has(id));
  if (removedTimers.length) ops.push(sb.from('active_timers').delete().in('id', removedTimers));
  if (db.active_timers.length) ops.push(sb.from('active_timers').upsert(_normalizeBatch(db.active_timers), { onConflict: 'id' }));
  _lastServerIds.active_timers = currentTimerIds;
  const results = await Promise.all(ops);
  for (const res of results) {
    if (res && res.error) {
      console.error('Upsert error:', res.error);
      throw new Error('Save failed: ' + (res.error.message || JSON.stringify(res.error)));
    }
  }
  // Step 4: re-pull so server-assigned values (ticket numbers, defaults) flow back into the cache.
  // Do NOT auto re-render here — the caller has just navigated to a fresh view and we'd clobber their state.
  try {
    const active = document.activeElement;
    const userIsTyping = active && ['INPUT','TEXTAREA','SELECT'].includes(active.tagName);
    await pullDBFromSupabase();
    if (!userIsTyping) render();
  } catch (e) { console.error('Post-save pull failed:', e); }
}

const POLICY_VERSION = '2026-05-08';
const POLICY_TEXT = 'HobbyTown Louisville Repair Policy. All repairs incur a minimum $30 service fee which includes diagnostic and up to 30 minutes of labor. Repair labor is $60/hour, billed in half-hour increments, plus parts. Repairs must be picked up within 14 days of notification that the repair is complete. After 14 days, a $10/week storage fee is added. After 60 days of not picking up your repair, it is considered abandoned and becomes property of HobbyTown Louisville.';
function fullCatalog() {
  const db = loadDB();
  return [...SHOP_CATALOG, ...(db.custom_catalog || [])];

// Damerau-Levenshtein edit distance — counts insertions, deletions, substitutions, AND transpositions
function editDistance(a, b) {
  if (a === b) return 0;
  const m = a.length, n = b.length;
  if (m === 0 || n === 0) return Math.max(m, n);
  if (Math.abs(m - n) > 5) return 99; // early bail-out for very different lengths
  const dp = new Array(m + 1);
  for (let i = 0; i <= m; i++) {
    dp[i] = new Array(n + 1).fill(0);
    dp[i][0] = i;
  }
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      const cost = a[i-1] === b[j-1] ? 0 : 1;
      dp[i][j] = Math.min(dp[i-1][j] + 1, dp[i][j-1] + 1, dp[i-1][j-1] + cost);
      // Transposition (e.g. "inferon" → "inferno")
      if (i > 1 && j > 1 && a[i-1] === b[j-2] && a[i-2] === b[j-1]) {
        dp[i][j] = Math.min(dp[i][j], dp[i-2][j-2] + 1);
      }
    }
  }
  return dp[m][n];
}
// Score how close a token is to the closest word in the description.
// Returns 6 for an edit-distance match (close typo), 5 for a 5-char prefix match, 0 if none.
function fuzzyTokenScore(descWords, token) {
  if (!token || token.length < 4) return 0; // too short — too risky to fuzzy-match
  const K = token.length <= 7 ? 1 : 2;
  for (const w of descWords) {
    if (Math.abs(w.length - token.length) <= K && editDistance(w, token) <= K) return 6;
  }
  // Long shared prefix suggests typo at the END (e.g. "stampped" vs "stampede")
  for (const w of descWords) {
    if (w.length < 5 || token.length < 5) continue;
    let prefix = 0;
    while (prefix < w.length && prefix < token.length && w[prefix] === token[prefix]) prefix++;
    if (prefix >= 5) return 5;
  }
  return 0;
}

function matchModelsForRepair(item_description) {
  // Scrub colors / serial numbers / drop-off chatter so they don't pollute matching
  let desc = (item_description || '').toLowerCase();
  if (!desc.trim()) return [];
  desc = desc
    .replace(/,?\s*sn\s*\S+/gi, ' ')
    .replace(/\b(red|blue|green|yellow|orange|black|white|silver|gold|gray|grey|purple|pink)\b/gi, ' ')
    .replace(/\s+/g, ' ').trim();
  // Dash-tolerant variant: "mini z" should match "mini-z", "xo 1" matches "xo-1", etc.
  // We compare each family token against BOTH desc (dash preserved) AND descNorm (dashes treated as spaces).
  const descNorm = desc.replace(/-/g, ' ').replace(/\s+/g, ' ');
  const containsTok = (t) => desc.includes(t) || (t.includes('-') && descNorm.includes(t.replace(/-/g, ' ')));
  // Word list for fuzzy matching (typos like "stampped" → "stampede")
  const descWords = descNorm.split(/\s+/).filter(w => w.length >= 3);

  // Detect brand in desc — if any brand is mentioned, GATE the catalog to that brand
  const brandsInDesc = ['traxxas','arrma','axial','losi','kyosho','tamiya','horizon','redcat']
    .filter(b => desc.includes(b));
  const gateBrand = brandsInDesc[0] || null;

  const scored = [];
  for (const m of fullCatalog()) {
    const brand = (m.brand || '').toLowerCase();
    // Gate: if user typed a brand and this entry is a different brand, skip entirely
    if (gateBrand && brand && brand !== gateBrand) continue;

    const fam = (m.family || '').toLowerCase();
    const sku = (m.sku || '').toLowerCase();
    let score = 0;

    // SKU match: very strong signal — word-boundary, also tolerate dash/no-dash variations in user input
    if (sku) {
      const skuParts = sku.split(/[\s\/\-]+/);
      for (const sp of skuParts) {
        if (sp.length >= 5) {
          const re = new RegExp('\\b' + sp.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b');
          if (re.test(desc) || re.test(descNorm)) score += 20;
        }
      }
    }

    // Brand match (still a small bonus when not gating, but no false-positive risk because of the gate above)
    if (brand && desc.includes(brand)) score += 3;

    // Family-level matching: split on whitespace/punct (NOT dash, so XO-1, TRX-4, Mini-T, 8IGHT-XE stay intact as tokens)
    const famTokens = fam.split(/[\s\/,()]+/).filter(t => t.length >= 2);
    // Sub-tokens from dashed words (e.g. "mercedes-benz" -> ["mercedes","benz"]) — useful when user types one half
    const subTokens = [];
    for (const t of famTokens) {
      if (t.includes('-')) {
        for (const sub of t.split('-')) {
          if (sub.length >= 3) subTokens.push(sub);
        }
      }
    }
    if (famTokens.length > 0) {
      const firstTok = famTokens[0];
      if (firstTok.length >= 3 && containsTok(firstTok)) {
        score += 8;
      } else {
        // Fuzzy fallback for misspellings: "stampped" → "stampede", "krayton" → "kraton", "slsh" → "slash"
        const fz = Math.max(
          fuzzyTokenScore(descWords, firstTok),
          firstTok.includes('-') ? fuzzyTokenScore(descWords, firstTok.replace(/-/g, '')) : 0
        );
        if (fz > 0) score += fz;
      }
      for (let i = 1; i < famTokens.length; i++) {
        const t = famTokens[i];
        if (containsTok(t)) {
          score += t.length >= 4 ? 3 : 1;
        }
      }
    }
    // Sub-tokens
    for (const t of subTokens) {
      if (desc.includes(t)) score += 3;
    }

    // Whole family name verbatim — also tolerant of dash/space differences
    if (fam && fam.length > 4 && (desc.includes(fam) || descNorm.includes(fam.replace(/-/g, ' ')))) score += 6;

    if (score >= 6) scored.push({ model: m, score });
  }
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, 4).map(s => s.model);
}

// ---------------- Computed helpers ----------------
function partOverdue(p) {
  if (!p.ordered_date || p.received_date) return null;
  const d = diffDays(p.ordered_date);
  return d >= 8 ? d : null;
}
// A closed repair (picked up or abandoned) is "archived" once 7 days have passed since closure.
// Archived repairs disappear from the normal dashboard but remain searchable and viewable in the archive.
const ARCHIVE_AFTER_DAYS = 7;
function repairClosureDate(r) {
  if (r.picked_up_date) return r.picked_up_date;
  if (r.abandoned_date) return r.abandoned_date;
  if (r.status === 'aband' && r.ready_notified_date) {
    // Abandoned without an explicit date — compute from the 60-day rule
    const d = new Date(r.ready_notified_date + 'T00:00:00');
    d.setDate(d.getDate() + 60);
    return d.toISOString().slice(0,10);
  }
  return null;
}
function isDeleted(r) { return !!r.deleted_at; }
function isArchived(r) {
  if (r.status !== 'picked' && r.status !== 'aband') return false;
  const closureDate = repairClosureDate(r);
  if (!closureDate) return false;
  return diffDays(closureDate) >= ARCHIVE_AFTER_DAYS;
}

function repairAlerts(r, partsForRepair) {
  const a = [];
  // Closed repairs (picked up / abandoned) don't generate alerts
  if (r.picked_up_date || r.status === 'picked' || r.status === 'aband') {
    return a;
  }
  for (const p of partsForRepair) {
    const d = partOverdue(p);
    if (d != null) a.push({ kind: 'part_overdue', text: `Part overdue ${d} days` });
  }
  if (r.ready_notified_date && !r.picked_up_date) {
    const d = diffDays(r.ready_notified_date);
    if (d >= 56 && d < 60) a.push({ kind: 'aband_soon', text: `Abandonment in ${60 - d} days` });
    else if (d >= 60) a.push({ kind: 'aband', text: 'Abandoned (60+ days)' });
    else if (d > 14) a.push({ kind: 'pickup_late', text: `Ready ${d} days, no pickup` });
  }
  return a;
}
// Storage fee per policy: $10/week starting day 15 after notification, until pickup
function storageFeeAccrued(r) {
  if (!r.ready_notified_date) return 0;
  const endDate = r.picked_up_date || todayISO();
  const start = new Date(r.ready_notified_date + 'T00:00:00');
  const end = new Date(endDate + 'T00:00:00');
  const days = Math.floor((end - start) / 86400000);
  if (days <= 14) return 0;
  // Week 1 = days 15-21, week 2 = 22-28, etc. Each STARTED week past day 14 costs $10.
  return Math.ceil((days - 14) / 7) * 10;
}
function partsTotal(parts) {
  return parts.reduce((s, p) => s + (p.price || 0), 0);
}

// ---------------- Timer helpers ----------------
function activeTimerForRepair(db, repair_id) {
  return (db.active_timers || []).find(t => t.repair_id === repair_id);
}
function activeTimerForUser(db, user_id) {
  return (db.active_timers || []).find(t => t.tech_id === user_id);
}
function elapsedMs(timer) { return Date.now() - new Date(timer.started_at).getTime(); }
function fmtElapsed(ms) {
  const total = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
// Cumulative-time billing: minimum 30 minutes per repair, then round UP to next 30-min increment
function billableMinutesFromTotal(rawMin) {
  if (!rawMin || rawMin <= 0) return 0;
  return Math.max(30, Math.ceil(rawMin / 30) * 30);
}
function totalRawMinutes(notes, laborEntries) {
  const sessionMin = (notes || [])
    .filter(n => n.note_type === 'work_session')
    .reduce((s, n) => s + (n.session_raw_minutes || 0), 0);
  const manualMin = (laborEntries || [])
    .reduce((s, l) => s + (Number(l.hours) || 0) * 60, 0);
  return sessionMin + manualMin;
}

// ---------------- Routing ----------------
let view = { name: 'dashboard' };
function go(v) { view = v; render(); }

// ---------------- Render ----------------
function render() {
  const u = currentUser();
  if (!u) {
    $topbar.classList.add('hidden');
    return renderLogin();
  }
  $topbar.classList.remove('hidden');
  $whoName.textContent = u.name + (u.role === 'owner' ? ' (Owner)' : '');
  const manageBtn = document.getElementById('manage-staff-btn');
  if (manageBtn) manageBtn.style.display = u.role === 'owner' ? 'inline-block' : 'none';
  if (view.name === 'dashboard') return renderDashboard();
  if (view.name === 'archive')   return renderDashboard(); // archive view reuses the dashboard renderer
  if (view.name === 'deleted')   return renderDashboard(); // deleted view reuses the dashboard renderer
  if (view.name === 'detail')    return renderDetail(view.id);
  if (view.name === 'new')       return renderIntake();
  go({ name: 'dashboard' });
}
